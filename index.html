 {id:'r3e',t:'quiz',xp:10,title:L('Box sizes','Lådstorlekar'),q:L('Which type holds whole numbers from 0 to 255?','Vilken typ rymmer heltal från 0 till 255?'),opts:['u8','i32','f64','char'],a:0,
  why:L('u means unsigned (no minus sign) and 8 means 8 bits. 8 bits can count 256 different values: 0 to 255.','u betyder unsigned (inget minustecken) och 8 betyder 8 bitar. 8 bitar kan räkna 256 olika värden: 0 till 255.')},
 {id:'r3f',t:'bug',xp:30,title:L('The overflowing level','Nivån som rann över'),
  body:L('<p>Run this. The hero levels up ten times from 250, and the program <b>panics</b> (crashes on purpose) the moment the level passes 255, because 256 doesn’t fit in a <code>u8</code>. Many languages would silently wrap around to 0 — a sneaky bug. Rust stops and tells you.</p><p>Fun fact: if Rust can see the overflow before running, like <code>255 + 1</code> written directly, it refuses to compile at all.</p>','<p>Kör det här. Hjälten går upp i nivå tio gånger från 250, och programmet får <b>panik</b> (kraschar med flit) i samma stund som nivån passerar 255, eftersom 256 inte får plats i en <code>u8</code>. Många språk skulle tyst slå runt till 0 — en lömsk bugg. Rust stannar och säger till.</p><p>Kul fakta: om Rust ser överflödet innan programmet körs, som <code>255 + 1</code> skrivet direkt, vägrar den kompilera.</p>'),
  goal:L('Use a bigger type so the hero reaches level 260.','Använd en större typ så att hjälten når nivå 260.'),hint:L('Change u8 to u16.','Byt u8 mot u16.'),
  starter:M('let mut level: u8 = 250;\nfor _ in 0..10 {\n    level += 1;\n}\nprintln!("{level}");'),sol:M('let mut level: u16 = 250;\nfor _ in 0..10 {\n    level += 1;\n}\nprintln!("{level}");'),ck:eq('260')},
]},
{id:'rs4',icon:'⚔️',title:L('Crossroads','Vägskälet'),sub:L('if, else and match','if, else och match'),card:'rs_one',steps:[
 {id:'r4a',t:'code',xp:30,title:L('The gate','Porten'),
  body:L('<p>Rust’s <code>if</code> needs no brackets around the question, but the body always goes in <code>{ }</code>.</p><pre>let hp = 50;\nif hp &gt; 0 {\n    println!("Still fighting!");\n} else {\n    println!("Game over...");\n}</pre>','<p>Rusts <code>if</code> behöver inga parenteser runt frågan, men kroppen ska alltid stå inom <code>{ }</code>.</p><pre>let hp = 50;\nif hp &gt; 0 {\n    println!("Still fighting!");\n} else {\n    println!("Game over...");\n}</pre>'),
  goal:L('level = 12. If it is 10 or more print Boss fight unlocked! — otherwise Keep training!','level = 12. Om den är 10 eller mer skriv Boss fight unlocked! — annars Keep training!'),hint:L('if level >= 10 {','if level >= 10 {'),
  starter:M('let level = 12;'),sol:M('let level = 12;\nif level >= 10 {\n    println!("Boss fight unlocked!");\n} else {\n    println!("Keep training!");\n}'),ck:all(eq('Boss fight unlocked!'),uses(/else/))},
 {id:'r4b',t:'code',xp:30,title:L('if gives back a value','if ger tillbaka ett värde'),
  body:L('<p>In Rust, <code>if</code> can produce a value — like a mini-calculation. No semicolons inside the branches!</p><pre>let n = 7;\nlet kind = if n % 2 == 0 { "even" } else { "odd" };\nprintln!("{kind}");</pre>','<p>I Rust kan <code>if</code> ge ett värde — som en liten uträkning. Inga semikolon inuti grenarna!</p><pre>let n = 7;\nlet kind = if n % 2 == 0 { "even" } else { "odd" };\nprintln!("{kind}");</pre>'),
  goal:L('temp = 30. Use let drink = if ... to pick "lemonade" (above 25) or "cocoa", then print drink.','temp = 30. Använd let drink = if ... för att välja "lemonade" (över 25) eller "cocoa" och skriv ut drink.'),hint:L('let drink = if temp > 25 { "lemonade" } else { "cocoa" };','let drink = if temp > 25 { "lemonade" } else { "cocoa" };'),
  starter:M('let temp = 30;'),sol:M('let temp = 30;\nlet drink = if temp > 25 { "lemonade" } else { "cocoa" };\nprintln!("{drink}");'),ck:all(eq('lemonade'),uses(/let\s+drink\s*=\s*if/))},
 {id:'r4c',t:'bug',xp:25,title:L('A Python habit','En Python-vana'),
  body:L('<p>Some languages treat any non-zero number as “true”. Rust doesn’t: an <code>if</code> question must be a real true/false.</p>','<p>Vissa språk räknar alla tal som inte är noll som ”sant”. Inte Rust: frågan i en <code>if</code> måste vara ett riktigt sant/falskt.</p>'),
  goal:L('Fix it so it prints You can buy a potion!','Fixa så att den skriver You can buy a potion!'),hint:L('Ask a real question: coins > 0','Ställ en riktig fråga: coins > 0'),
  starter:M('let coins = 3;\nif coins {\n    println!("You can buy a potion!");\n}'),sol:M('let coins = 3;\nif coins > 0 {\n    println!("You can buy a potion!");\n}'),ck:eq('You can buy a potion!')},
 {id:'r4d',t:'code',xp:35,title:L('The grading crab','Betygskrabban'),
  body:L('<p><code>match</code> compares a value against patterns, top to bottom. <code>80..=89</code> means “80 up to and including 89”. <code>_</code> catches everything else.</p><pre>let age = 15;\nlet stage = match age {\n    0..=12 =&gt; "kid",\n    13..=19 =&gt; "teen",\n    _ =&gt; "adult",\n};</pre>','<p><code>match</code> jämför ett värde mot mönster, uppifrån och ner. <code>80..=89</code> betyder ”80 till och med 89”. <code>_</code> fångar allt annat.</p><pre>let age = 15;\nlet stage = match age {\n    0..=12 =&gt; "kid",\n    13..=19 =&gt; "teen",\n    _ =&gt; "adult",\n};</pre>'),
  goal:L('score = 85. Match 90..=100 → "A", 80..=89 → "B", 70..=79 → "C", anything else → "F". Print the grade.','score = 85. Matcha 90..=100 → "A", 80..=89 → "B", 70..=79 → "C", allt annat → "F". Skriv ut betyget.'),hint:L('let grade = match score { ... }; then println!("{grade}");','let grade = match score { ... }; och sedan println!("{grade}");'),
  starter:M('let score = 85;'),sol:M('let score = 85;\nlet grade = match score {\n    90..=100 => "A",\n    80..=89 => "B",\n    70..=79 => "C",\n    _ => "F",\n};\nprintln!("{grade}");'),ck:all(eq('B'),uses(/match/))},
 {id:'r4e',t:'predict',xp:10,title:L('Pattern oracle','Mönsteroraklet'),code:M('let n = 3;\nlet word = match n {\n    1 => "one",\n    2 | 3 => "few",\n    _ => "many",\n};\nprintln!("{word}");'),opts:['few','one','many','3'],a:0,
  why:L('The | means “or”. 3 matches the pattern 2 | 3, so the answer is few.','| betyder ”eller”. 3 matchar mönstret 2 | 3, så svaret blir few.')},
 {id:'r4f',t:'quiz',xp:10,title:L('The underscore','Understrecket'),q:L('In a match, what does _ mean?','Vad betyder _ i en match?'),
  opts:[L('Anything else (a catch-all)','Allt annat (fånga-allt)'),L('Zero','Noll'),L('An empty string','En tom sträng'),L('Skip this match','Hoppa över matchen')],a:0,
  why:L('A match must cover every possible value. _ is the safety net that catches whatever the other arms didn’t.','En match måste täcka alla möjliga värden. _ är skyddsnätet som fångar det de andra armarna missade.')},
]},
{id:'rs5',icon:'🔁',title:L('Loop lagoon','Looplagunen'),sub:L('for, while and loop','for, while och loop'),card:'rs_crab',steps:[
 {id:'r5a',t:'code',xp:30,title:L('Tide counter','Tidvattenräknaren'),
  body:L('<p><code>1..5</code> is a range: 1, 2, 3, 4 (stops before 5). <code>1..=5</code> includes the 5.</p><pre>for i in 1..=3 {\n    println!("Wave {i}");\n}</pre>','<p><code>1..5</code> är ett intervall: 1, 2, 3, 4 (stannar före 5). <code>1..=5</code> tar med 5:an.</p><pre>for i in 1..=3 {\n    println!("Wave {i}");\n}</pre>'),
  goal:L('Print the numbers 1 to 5 with a for loop.','Skriv ut talen 1 till 5 med en for-loop.'),hint:L('for i in 1..=5 {','for i in 1..=5 {'),
  starter:M(''),sol:M('for i in 1..=5 {\n    println!("{i}");\n}'),ck:all(eq('1\n2\n3\n4\n5'),uses(/for/))},
 {id:'r5b',t:'predict',xp:10,title:L('Two dots or three?','Två punkter eller tre?'),code:M('for i in 0..3 {\n    println!("{i}");\n}'),opts:['0\n1\n2','1\n2\n3','0\n1\n2\n3','1\n2'],a:0,
  why:L('0..3 starts at 0 and stops before 3. Computers love counting from zero!','0..3 börjar på 0 och stannar före 3. Datorer älskar att räkna från noll!')},
 {id:'r5c',t:'code',xp:30,title:L('Countdown','Nedräkning'),
  body:L('<p><code>while</code> repeats as long as its question is true. The counter has to be <code>mut</code> so it can change.</p><pre>let mut fuel = 3;\nwhile fuel &gt; 0 {\n    println!("Burn!");\n    fuel -= 1;\n}</pre>','<p><code>while</code> upprepar så länge frågan är sann. Räknaren måste vara <code>mut</code> så att den kan ändras.</p><pre>let mut fuel = 3;\nwhile fuel &gt; 0 {\n    println!("Burn!");\n    fuel -= 1;\n}</pre>'),
  goal:L('Count down 5, 4, 3, 2, 1 with while, then print Go!','Räkna ner 5, 4, 3, 2, 1 med while och skriv sedan Go!'),hint:L('let mut n = 5; while n > 0 { ... n -= 1; }','let mut n = 5; while n > 0 { ... n -= 1; }'),
  starter:M(''),sol:M('let mut n = 5;\nwhile n > 0 {\n    println!("{n}");\n    n -= 1;\n}\nprintln!("Go!");'),ck:all(eq('5\n4\n3\n2\n1\nGo!'),uses(/while/))},
 {id:'r5d',t:'code',xp:35,title:L('The treasure loop','Skattloopen'),
  body:L('<p><code>loop</code> repeats forever — until you <code>break</code>. In Rust, break can even hand back a value!</p><pre>let mut n = 0;\nlet found = loop {\n    n += 1;\n    if n * n &gt; 50 {\n        break n;\n    }\n};\nprintln!("{found}");   // 8</pre>','<p><code>loop</code> upprepar för evigt — tills du gör <code>break</code>. I Rust kan break till och med lämna tillbaka ett värde!</p><pre>let mut n = 0;\nlet found = loop {\n    n += 1;\n    if n * n &gt; 50 {\n        break n;\n    }\n};\nprintln!("{found}");   // 8</pre>'),
  goal:L('Starting at 50, use loop to find the first number above 50 that divides evenly by 7. Print it.','Börja på 50 och använd loop för att hitta första talet över 50 som är jämnt delbart med 7. Skriv ut det.'),hint:L('Check n % 7 == 0, then break n;','Kolla n % 7 == 0 och gör sedan break n;'),
  starter:M('let mut n = 50;'),sol:M('let mut n = 50;\nlet found = loop {\n    n += 1;\n    if n % 7 == 0 {\n        break n;\n    }\n};\nprintln!("{found}");'),ck:all(eq('56'),uses(/loop/))},
 {id:'r5e',t:'bug',xp:30,title:L('The crab that never rests','Krabban som aldrig vilar'),
  body:L('<p>This loop never ends, so Code Quest stopped it. The energy never goes down!</p>','<p>Den här loopen tar aldrig slut, så Code Quest stoppade den. Energin minskar aldrig!</p>'),
  goal:L('Print Training... three times, then Rest time','Skriv Training... tre gånger, sedan Rest time'),hint:L('Inside the loop: energy -= 1;','I loopen: energy -= 1;'),
  starter:M('let mut energy = 3;\nwhile energy > 0 {\n    println!("Training...");\n}\nprintln!("Rest time");'),sol:M('let mut energy = 3;\nwhile energy > 0 {\n    println!("Training...");\n    energy -= 1;\n}\nprintln!("Rest time");'),ck:eq('Training...\nTraining...\nTraining...\nRest time')},
 {id:'r5f',t:'boss',xp:80,title:L('Boss: the FizzBuzz kraken','Boss: FizzBuzz-krakenen'),
  body:L('<p>The kraken rises! Print 1 to 20, but multiples of 3 → <code>Fizz</code>, multiples of 5 → <code>Buzz</code>, multiples of both → <code>FizzBuzz</code>.</p><p>Rust spells it <code>else if</code>.</p>','<p>Krakenen stiger! Skriv 1 till 20, men delbart med 3 → <code>Fizz</code>, delbart med 5 → <code>Buzz</code>, delbart med båda → <code>FizzBuzz</code>.</p><p>Rust stavar det <code>else if</code>.</p>'),
  goal:L('Print FizzBuzz from 1 to 20.','Skriv FizzBuzz från 1 till 20.'),hint:L('Check i % 15 == 0 first.','Kolla i % 15 == 0 först.'),
  starter:M('for i in 1..=20 {\n    // your code here\n}'),sol:M('for i in 1..=20 {\n    if i % 15 == 0 {\n        println!("FizzBuzz");\n    } else if i % 3 == 0 {\n        println!("Fizz");\n    } else if i % 5 == 0 {\n        println!("Buzz");\n    } else {\n        println!("{i}");\n    }\n}'),
  ck:eq('1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz\n16\n17\nFizz\n19\nBuzz')},
]},
{id:'rs6',icon:'✨',title:L('Function forge','Funktionssmedjan'),sub:L('Parameters, types and return values','Parametrar, typer och returvärden'),card:'rs_loved',steps:[
 {id:'r6a',t:'code',xp:35,title:L('Special ability','Specialförmåga'),
  body:L('<p>Functions live outside main. Every parameter needs a <b>type</b>: <code>&amp;str</code> is text, <code>u32</code> a positive whole number.</p><pre>fn battle_cry(name: &amp;str) {\n    println!("{name} attacks!");\n}\n\nfn main() {\n    battle_cry("Knight");\n}</pre>','<p>Funktioner bor utanför main. Varje parameter behöver en <b>typ</b>: <code>&amp;str</code> är text, <code>u32</code> ett positivt heltal.</p><pre>fn battle_cry(name: &amp;str) {\n    println!("{name} attacks!");\n}\n\nfn main() {\n    battle_cry("Knight");\n}</pre>'),
  goal:L('Write power_up(hero: &str, level: u32) that prints HERO leveled up to LEVEL! Call it with a name and 5.','Skriv power_up(hero: &str, level: u32) som skriver HERO leveled up to LEVEL! Anropa den med ett namn och 5.'),hint:L('println!("{} leveled up to {}!", hero, level);','println!("{} leveled up to {}!", hero, level);'),
  starter:'// write power_up here\n\n'+M('// call it here'),sol:'fn power_up(hero: &str, level: u32) {\n    println!("{} leveled up to {}!", hero, level);\n}\n\n'+M('power_up("Aria", 5);'),ck:all(has('leveled up to 5!'),uses(/fn power_up/))},
 {id:'r6b',t:'code',xp:35,title:L('The healing spring','Den läkande källan'),
  body:L('<p><code>-&gt; i32</code> says what type comes back. The <b>last line without a semicolon</b> is the answer the function returns.</p><pre>fn triple(n: i32) -&gt; i32 {\n    n * 3\n}</pre>','<p><code>-&gt; i32</code> säger vilken typ som kommer tillbaka. <b>Sista raden utan semikolon</b> är svaret funktionen returnerar.</p><pre>fn triple(n: i32) -&gt; i32 {\n    n * 3\n}</pre>'),
  goal:L('Write heal(hp: i32, amount: i32) -> i32 that returns the sum. Print heal(50, 30).','Skriv heal(hp: i32, amount: i32) -> i32 som returnerar summan. Skriv ut heal(50, 30).'),hint:L('The body is just: hp + amount','Kroppen är bara: hp + amount'),
  starter:M(''),sol:'fn heal(hp: i32, amount: i32) -> i32 {\n    hp + amount\n}\n\n'+M('println!("{}", heal(50, 30));'),ck:all(eq('80'),uses(/->\s*i32/))},
 {id:'r6c',t:'bug',xp:30,title:L('The sneaky semicolon','Det lömska semikolonet'),
  body:L('<p>One tiny character breaks this function. Read error <b>E0308</b>: the function promised an <code>i32</code> but gave back <code>()</code> — “nothing”.</p>','<p>Ett litet tecken förstör funktionen. Läs felet <b>E0308</b>: funktionen lovade en <code>i32</code> men gav tillbaka <code>()</code> — ”ingenting”.</p>'),
  goal:L('Make it print 25.','Få den att skriva 25.'),hint:L('Remove the semicolon after w * h.','Ta bort semikolonet efter w * h.'),
  starter:'fn area(w: i32, h: i32) -> i32 {\n    w * h;\n}\n\n'+M('println!("{}", area(5, 5));'),sol:'fn area(w: i32, h: i32) -> i32 {\n    w * h\n}\n\n'+M('println!("{}", area(5, 5));'),ck:eq('25')},
 {id:'r6d',t:'predict',xp:10,title:L('Double claw','Dubbelklo'),code:'fn double(n: i32) -> i32 {\n    n * 2\n}\n\n'+M('println!("{}", double(double(3)));'),opts:['12','6','9','error[E0308]: mismatched types'],a:0,
  why:L('Inside first: double(3) is 6, then double(6) is 12.','Insidan först: double(3) är 6, sedan blir double(6) 12.')},
 {id:'r6e',t:'quiz',xp:10,title:L('Last line rule','Sista radens regel'),q:L('In a Rust function, what happens to a last line with no semicolon?','Vad händer med en sista rad utan semikolon i en Rust-funktion?'),
  opts:[L('Its value is returned','Dess värde returneras'),L('It is an error','Det är ett fel'),L('It is ignored','Den ignoreras'),L('It is printed','Den skrivs ut')],a:0,
  why:L('Rust treats a final expression without ; as the function’s answer. You can also write return value; — both work.','Rust räknar ett sista uttryck utan ; som funktionens svar. Du kan också skriva return värde; — båda fungerar.')},
 {id:'r6f',t:'code',xp:40,title:L('The magic circle','Den magiska cirkeln'),
  body:L('<p>For decimals use <code>f64</code>. Remember: Rust won’t turn <code>2</code> into <code>2.0</code> for you.</p><pre>fn half(x: f64) -&gt; f64 {\n    x / 2.0\n}</pre>','<p>För decimaltal använder du <code>f64</code>. Kom ihåg: Rust gör inte om <code>2</code> till <code>2.0</code> åt dig.</p><pre>fn half(x: f64) -&gt; f64 {\n    x / 2.0\n}</pre>'),
  goal:L('Write circle_area(r: f64) -> f64 returning 3.14 * r * r. Print circle_area(2.0).','Skriv circle_area(r: f64) -> f64 som returnerar 3.14 * r * r. Skriv ut circle_area(2.0).'),hint:L('Call it with 2.0, not 2.','Anropa den med 2.0, inte 2.'),
  starter:M(''),sol:'fn circle_area(r: f64) -> f64 {\n    3.14 * r * r\n}\n\n'+M('println!("{}", circle_area(2.0));'),ck:all(eq('12.56'),uses(/f64/))},
]},
{id:'rs7',icon:'🏝️',title:L('Ownership island','Ägarskapsön'),sub:L('Rust’s superpower: move, borrow, clone','Rusts superkraft: move, borrow, clone'),card:'rs_safety',steps:[
 {id:'r7a',t:'code',xp:35,title:L('A string that grows','En sträng som växer'),
  body:L('<p>Rust has two kinds of text. <code>"hi"</code> is a <b>&amp;str</b> — a fixed slice. A <b>String</b> is owned text that can grow:</p><pre>let mut msg = String::from("Hi");\nmsg.push_str(" there");\nprintln!("{msg}");</pre>','<p>Rust har två sorters text. <code>"hi"</code> är en <b>&amp;str</b> — en fast bit. En <b>String</b> är ägd text som kan växa:</p><pre>let mut msg = String::from("Hi");\nmsg.push_str(" there");\nprintln!("{msg}");</pre>'),
  goal:L('Start with String::from("Hello"), push_str ", Rustacean!" onto it and print it.','Börja med String::from("Hello"), lägg till ", Rustacean!" med push_str och skriv ut den.'),hint:L('The String must be mut to grow.','Strängen måste vara mut för att kunna växa.'),
  starter:M(''),sol:M('let mut msg = String::from("Hello");\nmsg.push_str(", Rustacean!");\nprintln!("{msg}");'),ck:all(eq('Hello, Rustacean!'),uses(/push_str/))},
 {id:'r7a2',t:'predict',xp:10,title:L('Copy or move?','Kopiera eller flytta?'),code:M('let a = 5;\nlet b = a;\nprintln!("{} {}", a, b);'),opts:['5 5','5','error[E0382]: borrow of moved value: `a`','0 5'],a:0,
  why:L('Small simple values like numbers are just copied, so a and b both hold 5. Bigger values like String are MOVED instead — that’s the next quest!','Små enkla värden som tal kopieras bara, så både a och b har 5. Större värden som String FLYTTAS i stället — det är nästa uppdrag!')},
 {id:'r7b',t:'bug',xp:40,title:L('The treasure that moved','Skatten som flyttade'),
  body:L('<p>Every value in Rust has exactly <b>one owner</b>. <code>let b = a;</code> <b>moves</b> the String to b — a is now empty, like a chest you handed to a friend.</p><p>If you want two copies, make one with <code>.clone()</code>.</p>','<p>Varje värde i Rust har exakt <b>en ägare</b>. <code>let b = a;</code> <b>flyttar</b> strängen till b — a är nu tom, som en kista du gav till en kompis.</p><p>Om du vill ha två exemplar gör du en kopia med <code>.clone()</code>.</p>'),
  goal:L('Fix error E0382 so it prints treasure treasure','Fixa felet E0382 så att den skriver treasure treasure'),hint:L('let b = a.clone();','let b = a.clone();'),
  starter:M('let a = String::from("treasure");\nlet b = a;\nprintln!("{} {}", a, b);'),sol:M('let a = String::from("treasure");\nlet b = a.clone();\nprintln!("{} {}", a, b);'),ck:eq('treasure treasure')},
 {id:'r7c',t:'code',xp:40,title:L('Just borrowing','Bara låna'),
  body:L('<p>Cloning costs memory. Usually you just want to <b>lend</b> a value. <code>&amp;</code> makes a <b>reference</b>: the function borrows it and gives it back.</p><pre>fn shout(text: &amp;str) {\n    println!("{}!", text.to_uppercase());\n}\n\nlet name = String::from("bo");\nshout(&amp;name);      // lend it\nprintln!("{name}");  // still ours</pre>','<p>Att klona kostar minne. Oftast vill du bara <b>låna ut</b> ett värde. <code>&amp;</code> gör en <b>referens</b>: funktionen lånar värdet och lämnar tillbaka det.</p><pre>fn shout(text: &amp;str) {\n    println!("{}!", text.to_uppercase());\n}\n\nlet name = String::from("bo");\nshout(&amp;name);      // låna ut\nprintln!("{name}");  // fortfarande vår</pre>'),
  goal:L('Write count_letters(word: &str) -> usize returning word.len(). Print count_letters(&name), then print name.','Skriv count_letters(word: &str) -> usize som returnerar word.len(). Skriv ut count_letters(&name) och sedan name.'),hint:L('Call it as count_letters(&name) — note the &.','Anropa som count_letters(&name) — notera &.'),
  starter:M('let name = String::from("Ferris");'),sol:'fn count_letters(word: &str) -> usize {\n    word.len()\n}\n\n'+M('let name = String::from("Ferris");\nprintln!("{}", count_letters(&name));\nprintln!("{}", name);'),ck:all(eq('6\nFerris'),uses(/&name/))},
 {id:'r7d',t:'predict',xp:15,title:L('Who owns it?','Vem äger den?'),code:M('let s = String::from("hi");\nlet t = s;\nprintln!("{} {}", s, t);'),opts:['hi hi','hi','error[E0382]: borrow of moved value: `s`',"thread 'main' panicked"],a:2,
  why:L('let t = s; moved the String into t, so s can’t be used any more. The compiler catches this before the program even runs.','let t = s; flyttade strängen till t, så s kan inte användas längre. Kompilatorn hittar det innan programmet ens körs.')},
 {id:'r7e',t:'code',xp:40,title:L('Borrowing to change','Låna för att ändra'),
  body:L('<p><code>&amp;mut</code> lends a value <b>with permission to change it</b>. Inside the function, <code>*</code> reaches through the reference to the real value.</p><pre>fn add_gold(purse: &amp;mut i32) {\n    *purse += 10;\n}\n\nlet mut gold = 5;\nadd_gold(&amp;mut gold);   // gold is now 15</pre>','<p><code>&amp;mut</code> lånar ut ett värde <b>med lov att ändra det</b>. Inuti funktionen når <code>*</code> igenom referensen till det riktiga värdet.</p><pre>fn add_gold(purse: &amp;mut i32) {\n    *purse += 10;\n}\n\nlet mut gold = 5;\nadd_gold(&amp;mut gold);   // gold är nu 15</pre>'),
  goal:L('Write level_up(level: &mut u32) that adds 1. Start at 1, call it twice, print the level (3).','Skriv level_up(level: &mut u32) som lägger till 1. Börja på 1, anropa två gånger och skriv ut nivån (3).'),hint:L('*level += 1; and call it with level_up(&mut lvl);','*level += 1; och anropa med level_up(&mut lvl);'),
  starter:M('let mut lvl: u32 = 1;'),sol:'fn level_up(level: &mut u32) {\n    *level += 1;\n}\n\n'+M('let mut lvl: u32 = 1;\nlevel_up(&mut lvl);\nlevel_up(&mut lvl);\nprintln!("{lvl}");'),ck:all(eq('3'),uses(/&mut/))},
 {id:'r7e2',t:'quiz',xp:10,title:L('Look or change?','Titta eller ändra?'),q:L('Which parameter lets a function CHANGE the caller’s String?','Vilken parameter låter en funktion ÄNDRA anroparens String?'),opts:['s: &mut String','s: &String','s: String','s: &str'],a:0,
  why:L('&String and &str only let the function look. String takes ownership away. &mut String lends it with permission to change — and the caller keeps it.','&String och &str låter bara funktionen titta. String tar över ägandet. &mut String lånar ut den med lov att ändra — och anroparen får behålla den.')},
 {id:'r7f',t:'quiz',xp:10,title:L('The ownership rule','Ägarskapsregeln'),q:L('How many owners can a Rust value have at the same time?','Hur många ägare kan ett värde i Rust ha samtidigt?'),opts:['1','2','As many as you like','None'],a:0,
  why:L('One owner. When the owner goes away, Rust cleans up the value automatically — no garbage collector needed, and no forgotten memory.','En ägare. När ägaren försvinner städar Rust automatiskt bort värdet — ingen skräpsamlare behövs och inget minne glöms bort.')},
 {id:'r7g',t:'parsons',xp:30,title:L('Format without moving','Formatera utan att flytta'),
  body:L('<p><code>format!</code> works like println! but gives you a new String instead of printing. It only borrows its inputs. One line here is a trap!</p>','<p><code>format!</code> fungerar som println! men ger dig en ny String i stället för att skriva ut. Den lånar bara det den får. En rad här är en fälla!</p>'),
  goal:L('Print Hello, Ada! then Ada is still here','Skriv Hello, Ada! och sedan Ada is still here'),
  lines:['fn main() {','    let name = String::from("Ada");','    let greeting = format!("Hello, {}!", name);','    println!("{}", greeting);','    println!("{} is still here", name);','}'],distract:['    let name2 = name;'],ck:eq('Hello, Ada!\nAda is still here')},
]},
{id:'rs8',icon:'📦',title:L('The crate of collections','Samlingarnas låda'),sub:L('Vec and iterators','Vec och iteratorer'),card:'rs_linux',steps:[
 {id:'r8a',t:'code',xp:35,title:L('Crew list','Besättningslistan'),
  body:L('<p>A <code>Vec</code> is a list that can grow. Make one with <code>vec![]</code>. To print a whole Vec, use <code>{:?}</code> (debug format).</p><pre>let mut crew = vec!["Ferris", "Pinchy"];\ncrew.push("Shelly");\nprintln!("{:?}", crew);\nprintln!("{}", crew.len());</pre>','<p>En <code>Vec</code> är en lista som kan växa. Skapa en med <code>vec![]</code>. För att skriva ut en hel Vec använder du <code>{:?}</code> (debug-format).</p><pre>let mut crew = vec!["Ferris", "Pinchy"];\ncrew.push("Shelly");\nprintln!("{:?}", crew);\nprintln!("{}", crew.len());</pre>'),
  goal:L('Make a mut Vec team with 3 names, push a 4th, print it with {:?}.','Gör en mut Vec team med 3 namn, lägg till ett 4:e med push och skriv ut med {:?}.'),hint:L('let mut team = vec!["Aria", "Bolt", "Cinder"];','let mut team = vec!["Aria", "Bolt", "Cinder"];'),
  starter:M(''),sol:M('let mut team = vec!["Aria", "Bolt", "Cinder"];\nteam.push("Drake");\nprintln!("{:?}", team);'),ck:all(o=>/^\[.+\]$/.test(norm(o))&&norm(o).split(',').length===4,uses(/push/))},
 {id:'r8b',t:'bug',xp:35,title:L('The stubborn list','Den envisa listan'),
  body:L('<p>Two classic Vec bugs in one: the list can’t grow (it isn’t <code>mut</code>), and <code>{}</code> can’t display a whole list.</p>','<p>Två klassiska Vec-buggar i en: listan kan inte växa (den är inte <code>mut</code>), och <code>{}</code> kan inte visa en hel lista.</p>'),
  goal:L('Make it print [10, 20, 30]','Få den att skriva [10, 20, 30]'),hint:L('let mut scores, and print with {:?}','let mut scores, och skriv ut med {:?}'),
  starter:M('let scores = vec![10, 20];\nscores.push(30);\nprintln!("{}", scores);'),sol:M('let mut scores = vec![10, 20];\nscores.push(30);\nprintln!("{:?}", scores);'),ck:eq('[10, 20, 30]')},
 {id:'r8c',t:'code',xp:40,title:L('Leaderboard','Topplistan'),
  body:L('<p><code>.iter()</code> walks through a Vec. Iterators have helpers like <code>.sum()</code> and <code>.max()</code>. Rust needs to know what type the sum is:</p><pre>let total: i32 = nums.iter().sum();\nlet best = nums.iter().max().unwrap();</pre><p><code>max()</code> gives an Option (the list might be empty), so <code>unwrap()</code> takes the value out.</p>','<p><code>.iter()</code> går igenom en Vec. Iteratorer har hjälpare som <code>.sum()</code> och <code>.max()</code>. Rust behöver veta vilken typ summan har:</p><pre>let total: i32 = nums.iter().sum();\nlet best = nums.iter().max().unwrap();</pre><p><code>max()</code> ger en Option (listan kan vara tom), så <code>unwrap()</code> plockar ut värdet.</p>'),
  goal:L('For scores = vec![42, 17, 99, 63], print the total, then the highest score.','För scores = vec![42, 17, 99, 63], skriv ut summan och sedan högsta poängen.'),hint:L('Two lines like the example, then two println!','Två rader som exemplet och sedan två println!'),
  starter:M('let scores = vec![42, 17, 99, 63];'),sol:M('let scores = vec![42, 17, 99, 63];\nlet total: i32 = scores.iter().sum();\nlet best = scores.iter().max().unwrap();\nprintln!("{total}");\nprintln!("{best}");'),ck:all(eq('221\n99'),uses(/sum/))},
 {id:'r8d',t:'predict',xp:10,title:L('Peek inside','Kika in'),code:M('let v = vec![10, 20, 30];\nprintln!("{} {}", v[0], v.len());'),opts:['10 3','20 3','10 2','[10, 20, 30] 3'],a:0,
  why:L('Index 0 is the first item: 10. len() counts all three items.','Index 0 är första saken: 10. len() räknar alla tre sakerna.')},
 {id:'r8e',t:'code',xp:45,title:L('The iterator assembly line','Iteratorns löpande band'),
  body:L('<p>Iterators can be chained like an assembly line. <code>filter</code> keeps some items, <code>map</code> changes each item, <code>collect</code> packs the result into a new Vec.</p><pre>let big: Vec&lt;i32&gt; = (1..=5).map(|n| n * 10).collect();\n// [10, 20, 30, 40, 50]</pre><p><code>|n| n * 10</code> is a <b>closure</b>: a tiny unnamed function.</p>','<p>Iteratorer kan kedjas som ett löpande band. <code>filter</code> behåller vissa saker, <code>map</code> ändrar varje sak, <code>collect</code> packar resultatet i en ny Vec.</p><pre>let big: Vec&lt;i32&gt; = (1..=5).map(|n| n * 10).collect();\n// [10, 20, 30, 40, 50]</pre><p><code>|n| n * 10</code> är en <b>closure</b>: en liten namnlös funktion.</p>'),
  goal:L('From 1..=10 keep the even numbers, square them, collect into a Vec<i32> and print it with {:?}.','Från 1..=10, behåll de jämna talen, kvadrera dem, samla i en Vec<i32> och skriv ut med {:?}.'),hint:L('.filter(|n| n % 2 == 0).map(|n| n * n)','.filter(|n| n % 2 == 0).map(|n| n * n)'),
  starter:M(''),sol:M('let squares: Vec<i32> = (1..=10).filter(|n| n % 2 == 0).map(|n| n * n).collect();\nprintln!("{:?}", squares);'),ck:all(eq('[4, 16, 36, 64, 100]'),uses(/filter/),uses(/map/))},
 {id:'r8f',t:'quiz',xp:10,title:L('Out of bounds','Utanför gränsen'),q:L('A Vec has 3 items. What happens with v[10]?','En Vec har 3 saker. Vad händer med v[10]?'),
  opts:[L('The program panics with “index out of bounds”','Programmet får panik: ”index out of bounds”'),L('It gives 0','Den ger 0'),L('It gives random memory','Den ger slumpmässigt minne'),L('It adds 7 empty items','Den lägger till 7 tomma saker')],a:0,
  why:L('In some older languages, reading past the end gives you random memory — a huge security risk. Rust always checks and stops safely.','I vissa äldre språk ger läsning förbi slutet slumpmässigt minne — en stor säkerhetsrisk. Rust kollar alltid och stannar säkert.')},
]},
{id:'rs9',icon:'🔮',title:L('The Option oracle','Option-oraklet'),sub:L('Option, structs and the guessing game','Option, structs och gissningsspelet'),card:'rs_cargo',steps:[
 {id:'r9a',t:'code',xp:45,title:L('Maybe there’s an answer','Kanske finns ett svar'),
  body:L('<p>Rust has no “null”. A value that might be missing is an <code>Option</code>: either <code>Some(value)</code> or <code>None</code>. <code>match</code> makes you handle both.</p><pre>fn first_letter(word: &amp;str) -&gt; Option&lt;char&gt; {\n    word.chars().next()\n}</pre>','<p>Rust har inget ”null”. Ett värde som kan saknas är en <code>Option</code>: antingen <code>Some(värde)</code> eller <code>None</code>. <code>match</code> tvingar dig att hantera båda.</p><pre>fn first_letter(word: &amp;str) -&gt; Option&lt;char&gt; {\n    word.chars().next()\n}</pre>'),
  goal:L('Finish divide so it returns None when b is 0. main should print Result: 5 then Cannot divide by zero!','Gör klart divide så att den returnerar None när b är 0. main ska skriva Result: 5 och sedan Cannot divide by zero!'),hint:L('if b == 0 { None } else { Some(a / b) }','if b == 0 { None } else { Some(a / b) }'),
  starter:'fn divide(a: i32, b: i32) -> Option<i32> {\n    // return None or Some(...)\n}\n\n'+M('for b in [2, 0] {\n    match divide(10, b) {\n        Some(r) => println!("Result: {r}"),\n        None => println!("Cannot divide by zero!"),\n    }\n}'),
  sol:'fn divide(a: i32, b: i32) -> Option<i32> {\n    if b == 0 { None } else { Some(a / b) }\n}\n\n'+M('for b in [2, 0] {\n    match divide(10, b) {\n        Some(r) => println!("Result: {r}"),\n        None => println!("Cannot divide by zero!"),\n    }\n}'),ck:all(eq('Result: 5\nCannot divide by zero!'),uses(/None/))},
 {id:'r9b',t:'bug',xp:40,title:L('The empty chest','Den tomma kistan'),
  body:L('<p><code>unwrap()</code> says “I’m sure there’s a value”. If there isn’t, the program panics. Handle the <code>None</code> case with a match instead.</p>','<p><code>unwrap()</code> säger ”jag är säker på att det finns ett värde”. Om det inte finns får programmet panik. Hantera <code>None</code> med en match i stället.</p>'),
  goal:L('With no scores, print No scores yet instead of panicking.','Utan poäng, skriv No scores yet i stället för att få panik.'),hint:L('match scores.iter().max() { Some(b) => ..., None => ... }','match scores.iter().max() { Some(b) => ..., None => ... }'),
  starter:M('let scores: Vec<i32> = Vec::new();\nlet best = scores.iter().max().unwrap();\nprintln!("Best: {best}");'),sol:M('let scores: Vec<i32> = Vec::new();\nmatch scores.iter().max() {\n    Some(b) => println!("Best: {b}"),\n    None => println!("No scores yet"),\n}'),ck:eq('No scores yet')},
 {id:'r9c',t:'code',xp:40,title:L('Build a creature','Bygg en varelse'),
  body:L('<p>A <code>struct</code> groups related values under one name. <code>#[derive(Debug)]</code> on the line above lets you print it with <code>{:?}</code>.</p><pre>#[derive(Debug)]\nstruct Hero {\n    name: String,\n    hp: i32,\n}\n\nlet h = Hero { name: String::from("Ada"), hp: 100 };\nprintln!("{:?}", h);</pre>','<p>En <code>struct</code> samlar värden som hör ihop under ett namn. <code>#[derive(Debug)]</code> på raden ovanför gör att du kan skriva ut den med <code>{:?}</code>.</p><pre>#[derive(Debug)]\nstruct Hero {\n    name: String,\n    hp: i32,\n}\n\nlet h = Hero { name: String::from("Ada"), hp: 100 };\nprintln!("{:?}", h);</pre>'),
  goal:L('Make a Pet named "Ferris" with 10 legs and print it with {:?}.','Skapa ett Pet med namnet "Ferris" och 10 ben och skriv ut det med {:?}.'),hint:L('Add #[derive(Debug)] above struct Pet. The name needs String::from.','Lägg #[derive(Debug)] ovanför struct Pet. Namnet behöver String::from.'),
  starter:'struct Pet {\n    name: String,\n    legs: u32,\n}\n\n'+M(''),sol:'#[derive(Debug)]\nstruct Pet {\n    name: String,\n    legs: u32,\n}\n\n'+M('let p = Pet { name: String::from("Ferris"), legs: 10 };\nprintln!("{:?}", p);'),ck:eq('Pet { name: "Ferris", legs: 10 }')},
 {id:'r9d',t:'code',xp:50,title:L('Hero powers','Hjältekrafter'),
  body:L('<p><code>impl</code> gives a struct its own functions, called <b>methods</b>. <code>&amp;self</code> borrows the struct to read it; <code>&amp;mut self</code> borrows it to change it.</p><pre>impl Hero {\n    fn shout(&amp;self) {\n        println!("I am {}!", self.name);\n    }\n}</pre>','<p><code>impl</code> ger en struct egna funktioner, som kallas <b>metoder</b>. <code>&amp;self</code> lånar structen för att läsa; <code>&amp;mut self</code> lånar den för att ändra.</p><pre>impl Hero {\n    fn shout(&amp;self) {\n        println!("I am {}!", self.name);\n    }\n}</pre>'),
  goal:L('Add take_damage(&mut self, amount: i32): lower hp; if hp is 0 or less print NAME has fallen!, else print NAME: HP hp.','Lägg till take_damage(&mut self, amount: i32): minska hp; om hp är 0 eller mindre skriv NAME has fallen!, annars NAME: HP hp.'),hint:L('self.hp -= amount; then if self.hp <= 0 { ... } else { ... }','self.hp -= amount; och sedan if self.hp <= 0 { ... } else { ... }'),
  starter:'struct Hero {\n    name: String,\n    hp: i32,\n}\n\nimpl Hero {\n    fn new(name: &str) -> Hero {\n        Hero { name: name.to_string(), hp: 100 }\n    }\n    // add take_damage here\n}\n\n'+M('let mut ada = Hero::new("Ada");\nada.take_damage(30);\nada.take_damage(80);'),
  sol:'struct Hero {\n    name: String,\n    hp: i32,\n}\n\nimpl Hero {\n    fn new(name: &str) -> Hero {\n        Hero { name: name.to_string(), hp: 100 }\n    }\n    fn take_damage(&mut self, amount: i32) {\n        self.hp -= amount;\n        if self.hp <= 0 {\n            println!("{} has fallen!", self.name);\n        } else {\n            println!("{}: {} hp", self.name, self.hp);\n        }\n    }\n}\n\n'+M('let mut ada = Hero::new("Ada");\nada.take_damage(30);\nada.take_damage(80);'),ck:all(eq('Ada: 70 hp\nAda has fallen!'),uses(/&mut self/))},
 {id:'r9e',t:'mystery',xp:70,title:L('The crab who stole the pearl','Krabban som stal pärlan'),
  body:L('<p><b>Case file #4.</b> The Great Pearl is gone from the reef. Witnesses agree the thief had a <b>red shell</b>, <b>claws bigger than 5</b>, and was <b>at the reef</b> that night.</p><p>The suspects are tuples: (name, shell, claw size, at reef). The loop pulls each one apart for you.</p>','<p><b>Ärende #4.</b> Den stora pärlan är borta från revet. Vittnen säger att tjuven hade <b>rött skal</b>, <b>klor större än 5</b> och var <b>vid revet</b> den natten.</p><p>De misstänkta är tupler: (namn, skal, klostorlek, vid revet). Loopen plockar isär var och en åt dig.</p>'),
  goal:L('Print the name of every crab that matches all three clues, then accuse the thief.','Skriv ut namnet på varje krabba som matchar alla tre ledtrådarna och peka ut tjuven.'),hint:L('if *shell == "red" && *claw > 5 && *at_reef { println!("{name}"); }','if *shell == "red" && *claw > 5 && *at_reef { println!("{name}"); }'),
  starter:M('let suspects = vec![\n    ("Coral", "red", 7, true),\n    ("Pebble", "blue", 8, true),\n    ("Shelly", "red", 3, true),\n    ("Nipper", "red", 9, false),\n];\n\nfor (name, shell, claw, at_reef) in &suspects {\n    // detective work here\n}'),
  sol:M('let suspects = vec![\n    ("Coral", "red", 7, true),\n    ("Pebble", "blue", 8, true),\n    ("Shelly", "red", 3, true),\n    ("Nipper", "red", 9, false),\n];\nfor (name, shell, claw, at_reef) in &suspects {\n    if *shell == "red" && *claw > 5 && *at_reef {\n        println!("{name}");\n    }\n}'),opts:['Coral','Pebble','Shelly','Nipper'],answer:'Coral',pick:L('Accuse','Peka ut'),ck:eq('Coral')},
 {id:'r9e2',t:'code',xp:40,title:L('Listening to the player','Lyssna på spelaren'),
  body:L('<p>To read what the player types, Rust needs an empty String that can grow, and a <code>&amp;mut</code> borrow of it:</p><pre>let mut text = String::new();\nio::stdin().read_line(&amp;mut text).expect("Failed to read line");</pre><p>The text ends with the Enter key, so <code>.trim()</code> removes it before <code>.parse()</code> turns it into a number:</p><pre>let n: i32 = text.trim().parse().expect("Not a number");</pre>','<p>För att läsa det spelaren skriver behöver Rust en tom String som kan växa och ett <code>&amp;mut</code>-lån av den:</p><pre>let mut text = String::new();\nio::stdin().read_line(&amp;mut text).expect("Failed to read line");</pre><p>Texten slutar med Enter-tangenten, så <code>.trim()</code> tar bort den innan <code>.parse()</code> gör om texten till ett tal:</p><pre>let n: i32 = text.trim().parse().expect("Not a number");</pre>'),
  goal:L('Read a number from the player and print it doubled. Test input: 21','Läs ett tal från spelaren och skriv ut det dubblat. Testinput: 21'),hint:L('let n: i32 = text.trim().parse().expect("Not a number"); then println!("{}", n * 2);','let n: i32 = text.trim().parse().expect("Not a number"); sedan println!("{}", n * 2);'),
  inputs:['21'],starter:'use std::io;\n\n'+M('let mut text = String::new();\nio::stdin().read_line(&mut text).expect("Failed to read line");\n// turn text into a number and print it doubled'),
  sol:'use std::io;\n\n'+M('let mut text = String::new();\nio::stdin().read_line(&mut text).expect("Failed to read line");\nlet n: i32 = text.trim().parse().expect("Not a number");\nprintln!("{}", n * 2);'),ck:all(has('42'),uses(/parse/))},
 {id:'r9e3',t:'code',xp:40,title:L('Higher or lower','Högre eller lägre'),
  body:L('<p><code>a.cmp(&amp;b)</code> compares two values and answers with an <code>Ordering</code>: <code>Less</code>, <code>Greater</code> or <code>Equal</code>. A match must handle all three:</p><pre>use std::cmp::Ordering;\n\nmatch 5.cmp(&amp;9) {\n    Ordering::Less =&gt; println!("smaller"),\n    Ordering::Greater =&gt; println!("bigger"),\n    Ordering::Equal =&gt; println!("same"),\n}</pre>','<p><code>a.cmp(&amp;b)</code> jämför två värden och svarar med en <code>Ordering</code>: <code>Less</code>, <code>Greater</code> eller <code>Equal</code>. En match måste hantera alla tre:</p><pre>use std::cmp::Ordering;\n\nmatch 5.cmp(&amp;9) {\n    Ordering::Less =&gt; println!("smaller"),\n    Ordering::Greater =&gt; println!("bigger"),\n    Ordering::Equal =&gt; println!("same"),\n}</pre>'),
  goal:L('Compare guess with secret and print Too small!, Too big! or You win!','Jämför guess med secret och skriv Too small!, Too big! eller You win!'),hint:L('match guess.cmp(&secret) { Ordering::Less => println!("Too small!"), ... }','match guess.cmp(&secret) { Ordering::Less => println!("Too small!"), ... }'),
  starter:'use std::cmp::Ordering;\n\n'+M('let guess = 30;\nlet secret = 62;\n// match guess.cmp(&secret) here'),
  sol:'use std::cmp::Ordering;\n\n'+M('let guess = 30;\nlet secret = 62;\nmatch guess.cmp(&secret) {\n    Ordering::Less => println!("Too small!"),\n    Ordering::Greater => println!("Too big!"),\n    Ordering::Equal => println!("You win!"),\n}'),ck:all(eq('Too small!'),uses(/cmp/))},
 {id:'r9f',t:'boss',xp:120,title:L('Boss: the guessing game','Boss: gissningsspelet'),
  body:L('<p>The final boss is the program from chapter 2 of <i>The Rust Programming Language</i> — the official book every Rustacean reads!</p><p>Read a line with <code>io::stdin().read_line(&amp;mut guess)</code>, turn it into a number with <code>.trim().parse()</code>, and compare with <code>guess.cmp(&amp;secret)</code>, which gives <code>Ordering::Less</code>, <code>Greater</code> or <code>Equal</code>.</p><p>Test input: 50, 75, 62.</p>','<p>Slutbossen är programmet från kapitel 2 i <i>The Rust Programming Language</i> — den officiella boken som alla Rustaceans läser!</p><p>Läs en rad med <code>io::stdin().read_line(&amp;mut guess)</code>, gör om den till ett tal med <code>.trim().parse()</code> och jämför med <code>guess.cmp(&amp;secret)</code>, som ger <code>Ordering::Less</code>, <code>Greater</code> eller <code>Equal</code>.</p><p>Testinput: 50, 75, 62.</p>'),
  goal:L('Loop until the guess is right. Print Too small!, Too big! and finally You win!','Loopa tills gissningen är rätt. Skriv Too small!, Too big! och till slut You win!'),hint:L('Inside loop: read, parse into a u32, then match guess.cmp(&secret) with three arms. break after You win!','I loopen: läs, gör om till u32 och match guess.cmp(&secret) med tre armar. break efter You win!'),
  inputs:['50','75','62'],
  starter:'use std::cmp::Ordering;\nuse std::io;\n\n'+M('let secret: u32 = 62;\nprintln!("Guess the number!");\nloop {\n    let mut guess = String::new();\n    io::stdin().read_line(&mut guess).expect("Failed to read line");\n    let guess: u32 = guess.trim().parse().expect("Please type a number!");\n    // compare guess with secret here\n}'),
  sol:'use std::cmp::Ordering;\nuse std::io;\n\n'+M('let secret: u32 = 62;\nprintln!("Guess the number!");\nloop {\n    let mut guess = String::new();\n    io::stdin().read_line(&mut guess).expect("Failed to read line");\n    let guess: u32 = match guess.trim().parse() {\n        Ok(num) => num,\n        Err(_) => continue,\n    };\n    match guess.cmp(&secret) {\n        Ordering::Less => println!("Too small!"),\n        Ordering::Greater => println!("Too big!"),\n        Ordering::Equal => {\n            println!("You win!");\n            break;\n        }\n    }\n}'),ck:all(has('Too small!','Too big!','You win!'),uses(/cmp/))},
]},
];

let AC=null;
function tone(f,d,type,v){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=v||.045;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d+.02);}catch(e){}}
const SFX={click:()=>tone(660,.05),ok:()=>{tone(523,.1);setTimeout(()=>tone(659,.1),90);setTimeout(()=>tone(784,.16),180);},err:()=>{tone(196,.14,'sawtooth',.035);setTimeout(()=>tone(147,.18,'sawtooth',.03),110);},up:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.13),i*90)),catch:()=>tone(1100,.05,'sine',.05),miss:()=>tone(110,.12,'sawtooth',.035)};
function confetti(){
  if(RM)return;const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#ffd45e','#3ddc97','#ff8a3d','#7fd6ff','#ff9ad5','#c9a5ff'];
  const P=Array.from({length:90},()=>({x:innerWidth/2+(Math.random()-.5)*240,y:innerHeight*.45,vx:(Math.random()-.5)*13,vy:-(Math.random()*13+4),s:Math.random()*7+4,c:cols[Math.floor(Math.random()*6)],r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  let f=0;(function draw(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});if(++f<160)requestAnimationFrame(draw);else x.clearRect(0,0,c.width,c.height);})();
}

function drawAvatar(c){

/* ---------- 👣 watch it run: step-by-step visualiser ---------- */
function watch(lang,code,inputs){
  if(!code.trim()){toast(t('vzEmpty'));return;}
  const Lg=lang==='python'?PyLang:RsLang,r=Lg.run(code,{inputs:inputs||[],trace:true,traceMax:600});
  const expl=r.ok?'':tx(lang==='python'?explainPy(r.err,code):explainRs(r.err));
  if(!r.ok&&((lang==='rust'&&r.err.kind==='compile')||(lang==='python'&&!(r.trace&&r.trace.length)))){
    modal(`<div class="big">🛑</div><h2>${t(lang==='rust'?'vzNoCompile':'vzNoStart')}</h2><p>${t(lang==='rust'?'vzNoCompileP':'vzNoStartP')}</p><pre class="codeblock" style="text-align:left;white-space:pre-wrap">${esc(Lg.formatError(r.err,code))}</pre><p class="mfact">💡 ${esc(expl)}</p><div class="mbtns"><button class="btn" id="vzOk">${t('close')}</button></div>`);
    $('#vzOk').onclick=closeModal;return;}
  const tr=r.trace||[];if(!tr.length){toast(t('vzEmpty'));return;}
  const lines=code.split('\n'),w=document.createElement('div');w.className='vzwrap';w.setAttribute('role','dialog');w.setAttribute('aria-modal','true');
  w.innerHTML=`<div class="win vz"><div class="vz-head"><h2>👣 ${t('watch')}</h2><span id="vzCount"></span><button class="icon-btn" id="vzX" aria-label="${esc(t('close'))}">✕</button></div>
   <div class="vz-body"><div class="vz-code" id="vzCode">${lines.map((l,i)=>`<div class="vl" data-l="${i+1}"><span class="vn">${i+1}</span><span>${highlight(l,lang).replace(/\n $/,'')||' '}</span></div>`).join('')}</div>
    <div class="vz-side"><h3>${t('vzVars')}</h3><div id="vzVars"></div><h3>${t('vzStack')}</h3><div id="vzStack" class="vz-stack"></div><h3>${t('terminal')}</h3><pre id="vzOut" class="vz-out"></pre></div></div>
   <div class="vz-note" id="vzNote" aria-live="polite"></div>
   <div class="vz-ctl"><button class="btn small ghost" id="vzFirst" aria-label="${esc(t('vzFirst'))}">⏮</button><button class="btn small ghost" id="vzPrev">◀ ${t('vzBack')}</button><button class="btn small" id="vzNext">${t('vzNext')} ▶</button><button class="btn small ghost" id="vzLast" aria-label="${esc(t('vzLast'))}">⏭</button>
    <input type="range" id="vzRange" min="0" max="${tr.length-1}" value="0" aria-label="${esc(t('vzStep'))}"><button class="btn small ghost" id="vzPlay">▶ ${t('vzPlay')}</button></div></div>`;
  document.body.appendChild(w);
  const q=s=>w.querySelector(s);let i=0,timer=null;
  function show(k){
    i=Math.max(0,Math.min(tr.length-1,k));const s=tr[i],prev=tr[i-1],last=i===tr.length-1;
    q('#vzCount').textContent=`${t('vzStep')} ${i+1} / ${tr.length}`;
    w.querySelectorAll('.vl').forEach(el=>el.classList.toggle('cur',+el.dataset.l===s.line));
    const cl=q(`.vl[data-l="${s.line}"]`);if(cl)cl.scrollIntoView({block:'nearest'});
    const pv={};if(prev)prev.frames.forEach(f=>f.vars.forEach(v=>{pv[f.name+'|'+v[0]]=v[1];}));
    q('#vzVars').innerHTML=s.frames.map(f=>`<div class="vz-frame"><div class="vz-fn">${esc(f.name)}</div>${f.vars.length?f.vars.map(v=>`<div class="vz-var ${prev&&pv[f.name+'|'+v[0]]!==v[1]?'chg':''} ${v[3]||''}"><span class="vk">${esc(v[0])}</span><span class="vv">${esc(v[1])}</span><span class="vty">${esc(v[2]||'')}</span></div>`).join(''):`<div class="vz-empty">${t('vzNone')}</div>`}</div>`).join('');
    const st=s.stack.length?s.stack:[lang==='python'?'<module>':'main()'];
    q('#vzStack').innerHTML=st.slice().reverse().map((n,j)=>`<div class="${j===0?'top':''}">${esc(n)}</div>`).join('');
    q('#vzOut').textContent=r.out.slice(0,s.out);
    let note=s.line?`${t('vzNextLine')} ${s.line}`:t('vzDone'),isErr=false;
    if(last&&!r.ok){isErr=true;note=lang==='python'?`${r.err.type}: ${r.err.msg}`:(r.err.kind==='panic'?`panic: ${r.err.msg}`:r.err.msg);note+=' — '+expl;q('#vzOut').textContent=r.out;}
    if(last&&r.traceCut)note+=' '+t('vzCut');
    q('#vzNote').textContent=note;q('#vzNote').className='vz-note'+(isErr?' err':'');q('#vzRange').value=i;
  }
  const stop=()=>{clearInterval(timer);timer=null;q('#vzPlay').textContent='▶ '+t('vzPlay');};
  const close=()=>{stop();document.removeEventListener('keydown',key,true);w.remove();};
  const key=e=>{if(e.key==='ArrowRight'){e.preventDefault();e.stopPropagation();show(i+1);}else if(e.key==='ArrowLeft'){e.preventDefault();e.stopPropagation();show(i-1);}else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close();}else if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();q('#vzPlay').click();}};
  document.addEventListener('keydown',key,true);
  q('#vzX').onclick=close;q('#vzFirst').onclick=()=>show(0);q('#vzLast').onclick=()=>show(tr.length-1);
  q('#vzPrev').onclick=()=>{stop();show(i-1);};q('#vzNext').onclick=()=>{stop();show(i+1);};q('#vzRange').oninput=e=>{stop();show(+e.target.value);};
  q('#vzPlay').onclick=()=>{if(timer){stop();return;}if(i>=tr.length-1)show(0);q('#vzPlay').textContent='⏸ '+t('vzPause');timer=setInterval(()=>{if(i>=tr.length-1){stop();return;}show(i+1);},650);};
  show(0);q('#vzNext').focus();
}

function tutorial(key,steps){
  if(S.tut[key])return;steps=steps.filter(s=>$(s.sel));if(!steps.length)return;
  let i=0;const hole=document.createElement('div');hole.className='tut-hole';const box=document.createElement('div');box.className='win tut-box';document.body.append(hole,box);
  const end=()=>{hole.remove();box.remove();S.tut[key]=1;save();};
  function show(){const s=steps[i],el=$(s.sel);if(!el){end();return;}el.scrollIntoView({block:'nearest'});const r=el.getBoundingClientRect();
    Object.assign(hole.style,{left:r.left-6+'px',top:r.top-6+'px',width:r.width+12+'px',height:r.height+12+'px'});
    box.innerHTML=`<p>${esc(s.text)}</p><div class="mbtns"><button class="link" data-x="skip">${t('skip')}</button><button class="btn small" data-x="next">${i===steps.length-1?t('gotIt'):t('next')} (${i+1}/${steps.length})</button></div>`;
    const bw=Math.min(340,innerWidth*.92);let top=r.bottom+14;if(top+170>innerHeight)top=Math.max(10,r.top-180);
    Object.assign(box.style,{left:Math.max(10,Math.min(r.left,innerWidth-bw-10))+'px',top:top+'px'});
    box.querySelector('[data-x=next]').onclick=()=>{i++;i<steps.length?show():end();};box.querySelector('[data-x=skip]').onclick=end;box.querySelector('[data-x=next]').focus();}
  setTimeout(show,350);
}

/* ---------- code editor with highlighting ---------- */
const KW={python:/^(def|return|if|elif|else|for|while|in|not|and|or|import|from|as|try|except|finally|break|continue|pass|class|global|lambda|True|False|None|is|with|raise|assert|del)$/,
 rust:/^(fn|let|mut|if|else|match|loop|while|for|in|return|break|continue|struct|impl|use|pub|const|static|self|Self|true|false|as|ref|enum|trait|where|move)$/};
const BI={python:/^(print|input|len|range|int|str|float|list|dict|sum|max|min|sorted|round|abs|enumerate|zip|type|bool|ord|chr|tuple|any|all|map|filter|reversed)$/,
 rust:/^(i8|i16|i32|i64|u8|u16|u32|u64|usize|isize|f32|f64|bool|char|str|String|Vec|Option|Some|None|Ok|Err|Result|Ordering)$/};
function highlight(src,lang){
  const re=lang==='python'?/(#[^\n]*)|([fFrRbB]{0,2}(?:"""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)|"(?:[^"\\\n]|\\.)*"?|'(?:[^'\\\n]|\\.)*'?))|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g
    :/(\/\/[^\n]*)|("(?:[^"\\]|\\[\s\S])*"?|'(?:[^'\\\n]|\\.)')|(\b\d[\d_]*(?:\.\d+)?(?:[iuf]\d+|usize|isize)?\b)|([A-Za-z_]\w*!?)/g;
  let out='',last=0,m;
  while((m=re.exec(src))){
    out+=esc(src.slice(last,m.index));last=re.lastIndex;const tok=esc(m[0]);
    if(m[1])out+=`<span class="hc">${tok}</span>`;
    else if(m[2])out+=`<span class="hs">${tok}</span>`;
    else if(m[3])out+=`<span class="hn">${tok}</span>`;
    else{const w=m[4];
      if(lang==='rust'&&w.endsWith('!'))out+=`<span class="hm">${tok}</span>`;
      else if(KW[lang].test(w))out+=`<span class="hk">${tok}</span>`;
      else if(BI[lang].test(w))out+=`<span class="${lang==='rust'?'ht':'hb'}">${tok}</span>`;
      else if(src[re.lastIndex]==='(')out+=`<span class="hb">${tok}</span>`;
      else out+=tok;}
    if(m[0].length===0)re.lastIndex++;
  }
  return out+esc(src.slice(last))+'\n ';
}
function makeEditor(host,lang,code,onRun){
  host.innerHTML=`<div class="editor"><span class="edfile">${LI[lang].file}</span><div class="gutter"></div><div class="edwrap"><pre aria-hidden="true"></pre><textarea spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="${esc(t('edLabel'))}"></textarea></div></div>`;
  const ta=$('textarea',host),pre=$('pre',host),gut=$('.gutter',host);let errLine=0;
  const paint=()=>{pre.innerHTML=highlight(ta.value,lang);const n=ta.value.split('\n').length;let g='';for(let i=1;i<=n;i++)g+=(i===errLine?`<span class="el">${i}</span>`:i)+'\n';gut.innerHTML=g;sync();};
  const sync=()=>{pre.scrollTop=ta.scrollTop;pre.scrollLeft=ta.scrollLeft;gut.scrollTop=ta.scrollTop;};
  const ins=s=>{if(!document.execCommand||!document.execCommand('insertText',false,s)){const a=ta.selectionStart,b=ta.selectionEnd;ta.value=ta.value.slice(0,a)+s+ta.value.slice(b);ta.selectionStart=ta.selectionEnd=a+s.length;}paint();};
  const del=(from,to)=>{ta.setSelectionRange(from,to);let ok=false;try{ok=document.execCommand&&document.execCommand('delete');}catch(e){}if(!ok){const v=ta.value;ta.value=v.slice(0,from)+v.slice(to);ta.selectionStart=ta.selectionEnd=from;}paint();};
  ta.addEventListener('input',()=>{errLine=0;paint();});ta.addEventListener('scroll',sync);
  let escTab=false;
  ta.addEventListener('keydown',e=>{
    if(e.key==='Escape'){escTab=true;return;}
    if(e.key==='Tab'&&escTab){escTab=false;return;}
    if(e.key!=='Shift')escTab=false;
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();onRun&&onRun();return;}
    const a=ta.selectionStart,v=ta.value,ls=v.lastIndexOf('\n',a-1)+1,lineBefore=v.slice(ls,a);
    if(e.key==='Tab'){e.preventDefault();
      if(e.shiftKey){const sp=(v.slice(ls).match(/^ {1,4}/)||[''])[0].length;if(sp){del(ls,ls+sp);ta.setSelectionRange(Math.max(ls,a-sp),Math.max(ls,a-sp));}}
      else ins('    ');return;}
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();let ind=(lineBefore.match(/^\s*/)||[''])[0];const tr=lineBefore.trimEnd();
      if((lang==='python'&&tr.endsWith(':'))||(lang==='rust'&&/[{(\[]$/.test(tr)))ind+='    ';
      if(lang==='rust'&&/[{(\[]$/.test(tr)&&/^\s*[})\]]/.test(v.slice(a))){ins('\n'+ind+'\n'+ind.slice(4));ta.selectionStart=ta.selectionEnd=a+1+ind.length;return;}
      ins('\n'+ind);return;}
    if(e.key==='}'&&lang==='rust'&&/^\s{4,}$/.test(lineBefore)){e.preventDefault();ta.setSelectionRange(a-4,a);ins('}');return;}
    if(e.key==='Backspace'&&a===ta.selectionEnd&&/^( {4})+$/.test(lineBefore)){e.preventDefault();del(a-4,a);}
  });
  ta.value=code||'';paint();
  {const v=ta.value,ls=v.split('\n');let acc=0,sel=null;for(let i=0;i<ls.length;i++){const l=ls[i];if(/^\s+(pass\b.*|#.*|\/\/.*)$/.test(l)){sel=[acc+l.search(/\S/),acc+l.length];break;}if(i>0&&/^\s*$/.test(l)){sel=[acc+l.length,acc+l.length];break;}acc+=l.length+1;}
   if(!sel)sel=[v.length,v.length];ta.setSelectionRange(sel[0],sel[1]);if(window.matchMedia&&matchMedia('(pointer:fine)').matches)setTimeout(()=>{try{ta.focus({preventScroll:true});}catch(e){}},60);}
  return {get value(){return ta.value;},set value(s){ta.value=s;paint();},focus(){ta.focus();},mark(n){errLine=n;paint();},el:ta};
}
function runCode(lang,code,inputs){
  const L=lang==='python'?PyLang:RsLang;
  const r=L.run(code,{inputs:inputs||[]});
  if(!r.ok){r.pretty=L.formatError(r.err,code);r.explain=lang==='python'?explainPy(r.err,code):explainRs(r.err);r.tutor=LI[lang].tutor;}
  return r;
}
const usesInput=(lang,code)=>lang==='python'?/\binput\s*\(/.test(code):/read_line/.test(code);
function termHTML(r,extra){
  let h='';
  if(r.out)h+=`<span class="o-out">${esc(r.out)}</span>`;
  if(!r.ok)h+=`<span class=\"o-err\">${esc(r.pretty)}</span>`+(r.explain?`\n\n<span class=\"o-tip\">💡 ${esc(r.tutor)}: ${esc(tx(r.explain))}</span>`:'');
  else if(!r.out)h+=`<span class="o-info">${esc(t('noOutput'))}</span>`;
  if(extra)h+=extra;return h;
}

SCREENS.activity=(v,id)=>{
  const info=STEP[id];if(!info){go('map');return;}

  const s=info.s;

function duelPool(lang){
  const langs=lang==='both'?['python','rust']:[lang],items=[];
  langs.forEach(l=>{
    CH[l].forEach((c,ci)=>c.steps.forEach(s=>{if(s.t==='quiz'||s.t==='predict')items.push({s,lang:l,ci});}));
    DUEL_Q[l].forEach((d,i)=>items.push({s:Object.assign({id:'dq_'+l+i,t:d.code?'predict':'quiz'},d),lang:l,ci:d.ch}));
  });
  const prio=it=>(chOpen(it.lang,it.ci)?0:2)+(DUEL_SEEN.has(it.s.id)?1:0);
  return shuffle(items).sort((x,y)=>prio(x)-prio(y));
}

      v.innerHTML=`<div class="center"><div class="win results"><div class="big">⌨️</div><h2>${t('sdTitle')} · ${LI[lang].icon} ${LI[lang].name}</h2><p>${t('sdIntro')}</p><p><b>${esc(p?D.p1:D.p2)}</b>, ${t('lookAway')}</p><div class="mbtns"><button class="btn big" id="sdGo">${esc(p?D.p2:D.p1)} ${t('imReady')}</button></div></div></div>`;
      $('#sdGo').onclick=()=>{
        v.innerHTML=`<div class="act"><aside class="win lesson"><div class="act-head"><h2>${esc(p?D.p2:D.p1)}: ${t('yourTurn')}</h2><div class="tbar" style="width:100%"><i id="tb" style="width:100%"></i></div><p id="sdT" style="font-family:var(--px);margin-top:8px">120 s</p></div>${tutorHTML(lang)}</aside>
         <section class="work"><div class="goal">🎯 <span>${esc(tx(race.goal))}</span></div><div id="edHost" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
          <div class="edbar"><button class="btn" id="runBtn">▶ ${t('run')}</button><button class="btn ghost" id="gu">${t('giveUp')}</button></div>
          <div class="term"><div class="term-head"><span>${t('terminal')}</span></div><pre id="out"></pre></div></section></div>`;
        const ed=makeEditor($('#edHost'),lang,race.starter,check);$('#edHost .editor').style.flex='1';ed.focus();say(tx(race.goal));
        const st=Date.now(),LIM=120000;let over=false;
        const finish=time=>{if(over)return;over=true;clearInterval(timer);G.sd[p]=time;setTimeout(()=>{if(alive){p?results():turn(1);}},time!=null?1400:200);};
        timer=setInterval(()=>{const left=LIM-(Date.now()-st);$('#tb').style.width=Math.max(0,left/LIM*100)+'%';$('#sdT').textContent=Math.ceil(Math.max(0,left)/1000)+' s';if(left<=0)finish(null);},200);
        function check(){if(over)return;const r=runCode(lang,ed.value,[]);$('#out').innerHTML=termHTML(r);if(!r.ok){say(tx(r.explain),'wobble');SFX.err();return;}
          if(race.ck(r.out,ed.value)){const sec=Math.round((Date.now()-st)/100)/10;SFX.ok();say(`${t('solved')} ${sec}${t('seconds')}!`,'hop');finish(sec);}else{say(t('notQuite'),'wobble');SFX.err();}}
        $('#runBtn').onclick=check;$('#gu').onclick=()=>finish(null);
      };
    };
    turn(0);
  }
  function results(){
    clearInterval(timer);if(keyH){document.removeEventListener('keydown',keyH);keyH=null;}
    let sdLine='';
    if(D.sd){const [a,b]=G.sd;
      if(a!=null&&b!=null){const w=a<=b?0:1;G.sc[w]+=300;G.sc[1-w]+=100;}else if(a!=null)G.sc[0]+=300;else if(b!=null)G.sc[1]+=300;
      sdLine=`<p>⌨️ ${esc(D.p1)}: ${a!=null?t('solved')+' '+a+t('seconds'):t('notSolved')} · ${esc(D.p2)}: ${b!=null?t('solved')+' '+b+t('seconds'):t('notSolved')}</p>`;}
    const w=G.sc[0]===G.sc[1]?-1:G.sc[0]>G.sc[1]?0:1;
    v.innerHTML=`<div class="center"><div class="win results"><div class="big">${w<0?'🤝':'🏆'}</div><h2 class="${w===1?'p2c':'p1c'}">${w<0?t('draw'):esc(w?D.p2:D.p1)+' '+t('winner')}</h2>
     <div class="restable"><div><span class="p1c">${esc(D.p1)}</span><b>${G.sc[0]}</b><small>${t('correctAns')}: ${G.ok[0]}</small></div><div><span class="p2c">${esc(D.p2)}</span><b>${G.sc[1]}</b><small>${t('correctAns')}: ${G.ok[1]}</small></div></div>
     ${sdLine}<div class="mbtns"><button class="btn ghost" data-go="hub">${t('hubBtn')}</button><button class="btn" id="again">${t('rematch')}</button></div></div></div>`;
    $('#again').onclick=()=>{if(cleanup)cleanup();duelStart(v);};SFX.up();confetti();
  }
  question();
}

/* ---------- arcade ---------- */
SCREENS.arcade=(v,arg)=>{
  if(arg==='catcher')return catcher(v);if(arg==='sprint')return sprint(v);
  const b=S.best;
  v.innerHTML=`<div class="page"><h1>🕹️ ${t('arcadeTitle')}</h1><div class="games">
   <button class="win game" data-go="arcade" data-arg="catcher"><span class="gi">🪤</span><b>${t('catcher')}</b><span>${t('catcherS')}</span><span>${t('best')}: ${b['catch_'+S.path]||0}</span></button>
   <button class="win game" data-go="arcade" data-arg="sprint"><span class="gi">⌨️</span><b>${t('sprint')}</b><span>${t('sprintS')}</span><span>${t('best')}: ${b['sprint_'+S.path]||0} ${t('chars')}</span></button></div></div>`;
};
function finishGame(key,score,xp,html){
  const best=S.best[key]||0,nb=score>best;if(nb)S.best[key]=score;let up=false;if(xp>0){up=addXP(xp);S.coins+=Math.floor(xp/10);}save();renderTop();
  if(score>0){(up?SFX.up:SFX.ok)();confetti();}
  return `<div class="reward-row"><span>${t('score')}: ${score}</span><span class="x">+${xp} XP</span></div><p>${t('best')}: ${Math.max(best,score)}${nb&&score>0?' 🎉':''}</p>${html||''}`;
}
function catcher(v){
  const data=CATCH[S.path];let score=0,left=30,alive=true,caught=[];const items=[];
  v.innerHTML=`<div class="page" style="max-width:760px"><button class="back" data-go="arcade">← ${t('arcadeTitle')}</button><h1 style="margin-top:8px">🪤 ${t('catcher')}</h1>
   <div class="hudrow" style="margin-top:12px"><span>${t('score')}: <b id="cs">0</b></span><span>${t('time')}: <b id="ct">30</b></span></div><div class="arena" id="arena"></div><div id="cEnd"></div></div>`;
  const arena=$('#arena');
  const spawn=()=>{const good=Math.random()<.62,[txt,why]=(good?data.good:data.bad)[Math.floor(Math.random()*(good?data.good:data.bad).length)];
    const el=document.createElement('button');el.className='fall '+(good?'g':'b');el.textContent=txt;el.style.left=(4+Math.random()*72)+'%';el.style.top='-30px';arena.appendChild(el);
    const it={el,y:-30,sp:1.1+Math.random()*1.4};items.push(it);
    el.onclick=()=>{if(!alive)return;el.remove();it.dead=1;if(good){score+=10;SFX.catch();if(!caught.some(c=>c[0]===txt))caught.push([txt,why,1]);}else{score=Math.max(0,score-15);SFX.miss();shake(arena);if(!caught.some(c=>c[0]===txt))caught.push([txt,why,0]);}$('#cs').textContent=score;};};
  let last=performance.now(),acc=0,raf;
  const loop=now=>{if(!alive)return;const dt=Math.min(50,now-last);last=now;acc+=dt;if(acc>700){acc=0;spawn();}
    const H=arena.clientHeight;items.forEach(it=>{if(it.dead)return;it.y+=it.sp*dt/16;it.el.style.top=it.y+'px';if(it.y>H){it.dead=1;it.el.remove();}});raf=requestAnimationFrame(loop);};
  raf=requestAnimationFrame(loop);spawn();
  const tm=setInterval(()=>{left--;const ct=$('#ct');if(ct)ct.textContent=left;if(left<=0)end();},1000);
  function end(){alive=false;clearInterval(tm);cancelAnimationFrame(raf);arena.innerHTML='';
    const rec=caught.length?caught.map(c=>`<div><code style="color:${c[2]?'var(--good)':'var(--bad)'}">${esc(c[0])}</code><span>${esc(tx(c[1]))}</span></div>`).join(''):`<p>${t('noneCaught')}</p>`;
    $('#cEnd').innerHTML=`<div class="win" style="padding:18px">${finishGame('catch_'+S.path,score,Math.floor(score/3),`<h3 style="font-size:15px;margin-top:10px">${t('caught')}</h3><div class="recap">${rec}</div>`)}<div class="mbtns"><button class="btn" data-go="arcade" data-arg="catcher">${t('again')}</button></div></div>`;}
  cleanup=()=>{alive=false;clearInterval(tm);cancelAnimationFrame(raf);};
}
function sprintLines(){
  const lang=S.path,set=new Set(SPRINT[lang]);
  CH[lang].forEach((c,ci)=>{if(!chOpen(lang,ci))return;c.steps.forEach(s=>{const src=s.sol||(s.lines?s.lines.join('\n'):'');src.split('\n').forEach(l=>{l=l.trim();if(l.length>=12&&l.length<=46&&!/^(#|\/\/)/.test(l)&&!/^[}\])]/.test(l)&&/^[\x20-\x7e]+$/.test(l))set.add(l);});});});
  return shuffle(Array.from(set));
}
function sprint(v){
  const lines=sprintLines();let li=0,chars=0,typos=0,left=60,on=true;
  v.innerHTML=`<div class="page" style="max-width:860px"><button class="back" data-go="arcade">← ${t('arcadeTitle')}</button><h1 style="margin-top:8px">⌨️ ${t('sprint')}</h1>
   <div class="hudrow" style="margin-top:12px"><span>${t('score')}: <b id="ss">0</b> ${t('chars')}</span><span>${t('time')}: <b id="st">60</b></span></div>
   <p style="color:var(--muted);margin-top:10px">${t('typeThis')}</p><div class="sprint-line" id="sl"></div><input class="sprint-in" id="si" autocomplete="off" spellcheck="false" autocapitalize="off" aria-label="${esc(t('typeThis'))}"><div id="sEnd" style="margin-top:16px"></div></div>`;
  const inp=$('#si'),sl=$('#sl');let prev='';
  const paint=()=>{const target=lines[li%lines.length],typed=inp.value;let h='';
    for(let i=0;i<target.length;i++){const c=esc(target[i]);h+=i<typed.length?(typed[i]===target[i]?`<span class="ok">${c}</span>`:`<span class="no">${c}</span>`):`<span class="todo">${c}</span>`;}sl.innerHTML=h;};
  inp.oninput=()=>{if(!on)return;const target=lines[li%lines.length],v2=inp.value;if(v2.length>prev.length){const i=v2.length-1;if(v2[i]!==target[i]){typos++;SFX.miss();}}prev=v2;paint();};
  inp.onkeydown=e=>{if(e.key==='Enter'&&on){const target=lines[li%lines.length];if(inp.value===target){chars+=target.length;SFX.catch();li++;inp.value='';prev='';$('#ss').textContent=chars;paint();}else shake(inp);}};
  paint();inp.focus();
  const tm=setInterval(()=>{left--;$('#st').textContent=left;if(left<=0)end();},1000);
  function end(){on=false;clearInterval(tm);inp.disabled=true;
    $('#sEnd').innerHTML=`<div class="win" style="padding:18px;text-align:center">${finishGame('sprint_'+S.path,chars,Math.floor(chars/6),`<p>${typos} ${t('typos')}</p>`)}<div class="mbtns"><button class="btn" data-go="arcade" data-arg="sprint">${t('again')}</button></div></div>`;}
  cleanup=()=>{on=false;clearInterval(tm);};
}

/* ---------- boot ---------- */
document.documentElement.lang=S.ui;
window.addEventListener('pagehide',()=>{if(dirty)save();});
go('title');
})();

</script>
