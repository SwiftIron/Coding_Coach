/* ============ TOKENS ============ */
:root{
  --night:#15132f;--night2:#1d1b42;--win1:#2b3889;--win2:#1a225e;--frame:#e9e6ff;--shadow:#08071d;
  --ink:#f5f3ff;--muted:#b6b3de;--dim:#8481b6;--good:#3ddc97;--bad:#ff5d7a;--gold:#ffd45e;--code:#0e0d25;
  --acc:#3ddc97;--acc-ink:#062a1b;--acc2:#ffd45e;
  --px:'Quest Pixel','Courier New',monospace;--body:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',Ubuntu,Arial,sans-serif;--mono:ui-monospace,'Cascadia Mono','Roboto Mono','Noto Sans Mono','DejaVu Sans Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
body[data-path=rust]{--acc:#ff8a3d;--acc-ink:#3a1500;--acc2:#ffc7a1;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--night);background-image:radial-gradient(circle at 15% 10%,rgba(120,110,255,.12),transparent 40%),radial-gradient(circle at 90% 90%,color-mix(in srgb,var(--acc) 10%,transparent),transparent 45%);color:var(--ink);font:500 16px/1.55 var(--body);overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px;border-radius:6px}
code,pre,kbd{font-family:var(--mono)}
h1,h2,h3{font-family:var(--px);font-weight:400;letter-spacing:.5px;line-height:1.25}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#view{flex:1;min-height:0;overflow:auto;position:relative}

/* ============ SIGNATURE: the RPG window ============ */
.win{background:linear-gradient(180deg,var(--win1),var(--win2));border:3px solid var(--frame);border-radius:12px;box-shadow:0 0 0 3px var(--shadow),0 7px 0 3px var(--shadow);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:9px;border:3px solid var(--shadow);background:var(--acc);color:var(--acc-ink);font-weight:800;box-shadow:0 4px 0 var(--shadow);transition:transform .06s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--frame);box-shadow:0 4px 0 var(--shadow)}
.btn.gold{background:var(--gold);color:#3a2a00}
.btn.danger{background:var(--bad);color:#2b0009}
.btn.small{padding:6px 12px;font-size:14px}
.btn.big{padding:14px 28px;font-size:18px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.link{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}

/* ============ TOP BAR ============ */
.top{display:flex;align-items:center;gap:12px;padding:8px 16px;background:rgba(8,7,29,.78);border-bottom:3px solid var(--shadow);min-height:60px;flex-wrap:wrap}
body[data-screen=title] .top{display:none}
.logo{font-family:var(--px);font-size:18px;color:var(--acc);text-shadow:2px 2px 0 var(--shadow)}
.seg{display:inline-flex;border:3px solid var(--shadow);border-radius:10px;overflow:hidden;background:rgba(255,255,255,.04)}
.seg button{padding:6px 12px;color:var(--muted);font-weight:700;font-size:14px}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.grow{flex:1}
.player{display:flex;align-items:center;gap:9px}
.player canvas{width:30px;height:50px;image-rendering:pixelated}
.pl-title{font-size:13px;color:var(--muted);line-height:1.2}
.xpbar{width:110px;height:9px;border-radius:5px;background:rgba(255,255,255,.1);border:2px solid var(--shadow);overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:var(--acc2);transition:width .8s cubic-bezier(.2,1,.3,1)}
.lvl{font-family:var(--px);font-size:14px;color:var(--acc2)}
.stat{font-weight:800;font-size:15px;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.05)}
.icon-btn{width:40px;height:40px;border-radius:9px;font-size:20px;border:3px solid var(--shadow);background:rgba(255,255,255,.06)}
.icon-btn:hover{background:rgba(255,255,255,.12)}

/* ============ TITLE ============ */
.title-scr{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px 16px;text-align:center}
.brand{font-family:var(--px);font-size:clamp(16px,3vw,24px);color:var(--gold);border:3px solid var(--gold);border-radius:10px;padding:10px 22px;box-shadow:0 0 0 3px var(--shadow),0 6px 0 3px var(--shadow);background:rgba(255,212,94,.06)}
.title-scr canvas{width:72px;height:120px;image-rendering:pixelated;margin-top:8px}
.logo-big{font-size:clamp(40px,8vw,76px);color:var(--ink);text-shadow:4px 4px 0 var(--shadow),0 0 30px rgba(140,130,255,.35)}
.tag{color:var(--muted);font-size:18px;margin-top:-10px}
.path-pick{display:grid;grid-template-columns:repeat(2,minmax(0,280px));gap:22px;margin-top:10px}
.pathcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 18px 18px;text-align:center;transition:transform .12s}
.pathcard:hover{transform:translateY(-4px)}
.pathcard .pc-icon{font-size:46px}
.pathcard b{font-family:var(--px);font-size:22px;font-weight:400}
.pathcard small{color:var(--muted);font-size:14px}
.pathcard em{font-style:normal;font-weight:800;font-size:13px;margin-top:6px;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.08)}
.pathcard.py b{color:#3ddc97}.pathcard.rs b{color:#ff8a3d}
.title-foot{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}

/* ============ HUB ============ */
.page{max-width:1080px;margin:0 auto;padding:26px 18px 40px}
.cont{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding:24px 26px}
.cont-art{font-size:58px;width:92px;height:92px;display:grid;place-items:center;border-radius:14px;background:rgba(0,0,0,.25);border:3px solid var(--shadow)}
.cont small{color:var(--muted);font-weight:700}
.cont h2{font-size:clamp(20px,3vw,28px);margin:4px 0 6px;color:var(--ink)}
.typebadge{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:800;padding:3px 10px;border-radius:20px;background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:30px}
.tile{display:flex;flex-direction:column;gap:6px;padding:18px;text-align:left;min-height:150px;transition:transform .12s}
.tile:hover{transform:translateY(-3px)}
.tile .ti{font-size:34px}
.tile b{font-family:var(--px);font-weight:400;font-size:17px}
.tile span{color:var(--muted);font-size:14px}
.tile.wide{grid-column:span 2}
.meter{height:10px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:auto;border:2px solid var(--shadow)}
.meter i{display:block;height:100%;background:var(--acc)}
.fact{display:flex;gap:14px;align-items:flex-start;margin-top:30px;padding:16px 18px;border-left:5px solid var(--acc2);background:rgba(255,255,255,.04);border-radius:8px}
.fact p{flex:1;color:var(--ink)}
.fact .fi{font-size:24px}

/* ============ MAP ============ */
.map{display:grid;grid-template-columns:330px 1fr;gap:24px;max-width:1150px;margin:0 auto;padding:22px 18px 40px;align-items:start}
.chapters{display:flex;flex-direction:column;gap:10px}
.chap{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;border:3px solid transparent;background:rgba(255,255,255,.04)}
.chap:hover:not(:disabled){background:rgba(255,255,255,.08)}
.chap.sel{border-color:var(--frame);background:linear-gradient(180deg,var(--win1),var(--win2));box-shadow:0 0 0 3px var(--shadow)}
.chap:disabled,.chap[aria-disabled=true]{opacity:.42;cursor:not-allowed}.node[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.chap .ci{font-size:28px;text-align:center}
.chap b{display:block;font-size:15px}
.chap small{color:var(--muted);font-size:13px}
.chap .cp{font-size:13px;font-weight:800;color:var(--muted)}
.chap.full .cp{color:var(--good)}
.steps{padding:22px 24px}
.steps h2{font-size:24px}
.steps .sub{color:var(--muted);margin-bottom:18px}
.path{display:flex;flex-direction:column;position:relative}
.node{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:10px 12px;border-radius:12px;text-align:left;position:relative}
.node:hover:not(:disabled){background:rgba(255,255,255,.07)}
.node:disabled{opacity:.45;cursor:not-allowed}
.node .ni{width:52px;height:52px;display:grid;place-items:center;font-size:24px;border-radius:50%;background:rgba(0,0,0,.3);border:3px solid var(--shadow);position:relative;z-index:1}
.node.done .ni{background:color-mix(in srgb,var(--good) 30%,#0a2a1c);border-color:var(--good)}
.node.next .ni{border-color:var(--acc2);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc2) 30%,transparent)}
.node::before{content:'';position:absolute;left:36px;top:-12px;height:24px;border-left:3px dotted rgba(255,255,255,.25)}
.node:first-child::before{display:none}
.node b{display:block}
.node small{color:var(--muted);font-size:13px}
.node .nx{font-size:13px;font-weight:800;color:var(--gold)}
.testrow{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;width:100%;padding:10px 12px;margin-bottom:14px;border-radius:12px;border:2px dashed rgba(255,255,255,.28);text-align:left}.testrow:hover{background:rgba(255,255,255,.06)}.testrow.pro{border:3px solid var(--gold);background:rgba(255,212,94,.08)}.testrow .ni{width:52px;height:52px;display:grid;place-items:center;font-size:24px;border-radius:50%;background:rgba(0,0,0,.3);border:3px solid var(--shadow)}.testrow small{display:block;color:var(--muted);font-size:13px}.testrow .nx{font-size:13px;font-weight:800;color:var(--gold)}.node.expert{margin-top:4px}.node.expert .ni{border-color:var(--gold)}.node.expert::before{border-left-style:dashed}.cont-btns{display:flex;flex-direction:column;gap:10px}.lesson-body details.more summary{cursor:pointer;color:var(--acc2);font-weight:800;margin:8px 0}.expopts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.expcard{display:flex;flex-direction:column;gap:6px;padding:16px;text-align:left}.expcard span{font-size:34px}.expcard b{font-size:16px}.expcard small{color:var(--muted);font-size:13.5px}@media (max-width:560px){.expopts{grid-template-columns:1fr}}
.reward{display:flex;gap:12px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:10px;border:2px dashed rgba(255,255,255,.25);color:var(--muted);font-size:14px}
.reward .ri{font-size:26px}

/* ============ ACTIVITY ============ */
.act{height:100%;display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:16px;padding:14px}
.lesson{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.act-head{padding:14px 18px 10px;border-bottom:2px solid rgba(255,255,255,.08)}
.back{color:var(--muted);font-weight:700;font-size:14px}
.back:hover{color:var(--ink)}
.act-head h2{font-size:19px;margin:8px 0 6px}
.dots{display:flex;gap:5px;margin-top:8px}
.dots i{width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.dots i.d{background:var(--good)}.dots i.c{background:var(--acc2)}
.lesson-body{flex:1;overflow:auto;padding:14px 18px;font-size:15.5px}
.lesson-body p{margin-bottom:10px}
.lesson-body code{font-size:13.5px;background:rgba(0,0,0,.35);padding:1px 6px;border-radius:5px;color:var(--acc2)}
.lesson-body pre,.codeblock{background:var(--code);border:2px solid var(--shadow);border-radius:8px;padding:10px 12px;font-size:13.5px;line-height:1.6;overflow-x:auto;margin:8px 0 12px;color:#dcdaff;white-space:pre}
.solbox{margin-top:12px;padding:12px;border-radius:10px;border:2px dashed var(--gold);background:rgba(255,212,94,.06)}
.solbox h3{font-size:14px;color:var(--gold);margin-bottom:6px}
.accuse{padding:12px 18px;border-top:2px solid rgba(255,255,255,.08)}
.accuse h3{font-size:14px;margin-bottom:8px;color:var(--acc2)}
.accuse .row{display:flex;flex-wrap:wrap;gap:8px}

<script>
/* =================================================================
   PYTHON INTERPRETER  (a teaching subset of Python 3)
   tokenizer -> parser (AST) -> tree-walking evaluator
   ints are BigInt, floats are Number, so 7/2 = 3.5 and 7//2 = 3
   ================================================================= */
var PyLang=(function(){
'use strict';
class PyError extends Error{constructor(type,msg,line){super(msg);this.type=type;this.line=line;}}
const KW=new Set(['False','None','True','and','as','assert','break','class','continue','def','del','elif','else','except','finally','for','from','global','if','import','in','is','lambda','nonlocal','not','or','pass','raise','return','try','while','with','yield']);
const ID0=/[\p{L}_]/u,IDN=/[\p{L}\p{N}_]/u;

/* ---------- TOKENIZER ---------- */
function tokenize(src,line0){
  const s=src.replace(/\r\n?/g,'\n'),n=s.length,toks=[],indents=[0],brackets=[];
  let i=0,line=line0||1,bol=true;
  const push=(t,v)=>toks.push({t,v,line});
  const err=(m,l)=>{throw new PyError('SyntaxError',m,l||line);};
  while(i<n){
    if(bol){
      let col=0,j=i;
      while(j<n&&(s[j]===' '||s[j]==='\t')){col+=s[j]==='\t'?4:1;j++;}
      if(j>=n)break;
      if(s[j]==='\n'){i=j+1;line++;continue;}
      if(s[j]==='#'){while(j<n&&s[j]!=='\n')j++;i=j;continue;}
      if(!brackets.length){
        const top=indents[indents.length-1];
        if(col>top){indents.push(col);push('INDENT');}
        else if(col<top){
          while(col<indents[indents.length-1]){indents.pop();push('DEDENT');}
          if(col!==indents[indents.length-1])throw new PyError('IndentationError','unindent does not match any outer indentation level',line);
        }
      }
      i=j;bol=false;continue;
    }
    const c=s[i];
    if(c==='\n'){i++;if(!brackets.length){push('NEWLINE');bol=true;}line++;continue;}
    if(c===' '||c==='\t'){i++;continue;}
    if(c==='#'){while(i<n&&s[i]!=='\n')i++;continue;}
    if(c==='\\'&&s[i+1]==='\n'){i+=2;line++;continue;}
    if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(s[i+1]||''))){
      let j=i,isF=false;
      while(j<n&&/[0-9_]/.test(s[j]))j++;
      if(s[j]==='.'&&!/[\p{L}_]/u.test(s[j+1]||'')){isF=true;j++;while(j<n&&/[0-9_]/.test(s[j]))j++;}

      if(ID0.test(s[j]||''))err('invalid decimal literal');
      const raw=s.slice(i,j).replace(/_/g,'');
      push('NUM',isF?parseFloat(raw):BigInt(raw));i=j;continue;
    }
    if(ID0.test(c)){
      let j=i;while(j<n&&IDN.test(s[j]))j++;
      const w=s.slice(i,j);
      if((s[j]==='"'||s[j]==="'")&&/^(f|r|rf|fr|b)$/i.test(w)){i=j;readStr(w.toLowerCase());continue;}

function walk(body,fn){for(const s of body){fn(s);if(s.k==='def')continue;for(const key of ['body','orelse','fin'])if(Array.isArray(s[key]))walk(s[key],fn);if(s.handlers)s.handlers.forEach(h=>walk(h.body,fn));}}

/* ---------- RUNTIME VALUES ---------- */
class Tup{constructor(a){this.a=a;}}
class Dict{
  constructor(){this.m=new Map();}
  static key(k,line){
    if(Array.isArray(k)||k instanceof Dict)throw new PyError('TypeError',`unhashable type: '${typeName(k)}'`,line);
    if(k instanceof Tup)return 'T:'+repr(k);
    if(typeof k==='number'&&Number.isInteger(k))return BigInt(k);
    if(typeof k==='boolean')return BigInt(k?1:0);
    return k;
  }
  get(k,line){const e=this.m.get(Dict.key(k,line));return e;}
  set(k,v,line){const kk=Dict.key(k,line),e=this.m.get(kk);if(e)e[1]=v;else this.m.set(kk,[k,v]);}
  has(k,line){return this.m.has(Dict.key(k,line));}
  del(k,line){return this.m.delete(Dict.key(k,line));}
  keys(){return [...this.m.values()].map(e=>e[0]);}
  vals(){return [...this.m.values()].map(e=>e[1]);}
}
class Range{constructor(a,b,c){this.a=a;this.b=b;this.c=c;}
  get len(){const{a,b,c}=this;if(c>0n)return b>a?(b-a+c-1n)/c:0n;return a>b?(a-b-c-1n)/(-c):0n;}
  at(i){return this.a+this.c*i;}}
class Func{constructor(node,closure,defaults){this.node=node;this.closure=closure;this.defaults=defaults;this.name=node.name||'<lambda>';}}
class Mod{constructor(name,attrs){this.name=name;this.attrs=attrs;}}
class Exc{constructor(type,msg){this.type=type;this.msg=msg;}}
const BRK={},CNT={};
class Ret{constructor(v){this.v=v;}}

function bi(name,fn,cls){fn.pyName=name;if(cls)fn.pyClass=cls;return fn;}
function typeName(v){
  if(v===null||v===undefined)return 'NoneType';
  switch(typeof v){case 'bigint':return 'int';case 'number':return 'float';case 'boolean':return 'bool';case 'string':return 'str';case 'function':return v.pyClass?'type':'builtin_function_or_method';}
  if(Array.isArray(v))return 'list';if(v instanceof Tup)return 'tuple';if(v instanceof Dict)return 'dict';if(v instanceof Range)return 'range';
  if(v instanceof Func)return 'function';if(v instanceof Mod)return 'module';if(v instanceof Exc)return v.type;return 'object';
}
function floatRepr(x){
  if(x!==x)return 'nan';if(x===Infinity)return 'inf';if(x===-Infinity)return '-inf';
  if(x===0)return Object.is(x,-0)?'-0.0':'0.0';

function strRepr(s){
  const q=s.includes("'")&&!s.includes('"')?'"':"'";

}
function repr(v,seen){
  if(v===null||v===undefined)return 'None';
  switch(typeof v){case 'bigint':return v.toString();case 'number':return floatRepr(v);case 'boolean':return v?'True':'False';case 'string':return strRepr(v);
    case 'function':return v.pyClass?`<class '${v.pyClass}'>`:`<built-in function ${v.pyName||'?'}>`;}
  seen=seen||[];if(seen.includes(v))return Array.isArray(v)?'[...]':'{...}';seen.push(v);

  else if(v instanceof Tup)r='('+v.a.map(x=>repr(x,seen)).join(', ')+(v.a.length===1?',':'')+')';
  else if(v instanceof Dict)r='{'+[...v.m.values()].map(e=>repr(e[0],seen)+': '+repr(e[1],seen)).join(', ')+'}';
  else if(v instanceof Range)r=`range(${v.a}, ${v.b}${v.c!==1n?', '+v.c:''})`;
  else if(v instanceof Func)r=`<function ${v.name}>`;

  else if(v instanceof Exc)r=`${v.type}(${strRepr(v.msg)})`;

    return L('Python got a value of the wrong type. Read the last line to see which types it met.','Python fick ett värde av fel typ. Läs sista raden för att se vilka typer det handlar om.');}
  if(t==='ZeroDivisionError')return L('Dividing by zero is impossible — even for computers!','Att dela med noll är omöjligt — även för datorer!');
  if(t==='IndexError')return L('That position doesn’t exist. Remember: the first item is [0] and the last is [-1].','Den platsen finns inte. Kom ihåg: första saken är [0] och sista är [-1].');
  if(t==='KeyError')return L('That key isn’t in the dictionary. Check the spelling, or use .get(key) to be safe.','Den nyckeln finns inte i dictionaryn. Kolla stavningen, eller använd .get(key) för att vara säker.');

  if(t==='TimeoutError')return L('Your program never stopped — probably a loop that never ends. Make sure the loop’s question becomes False.','Ditt program stannade aldrig — troligen en loop som aldrig tar slut. Se till att loopens fråga blir False.');
  if(t==='RecursionError')return L('A function keeps calling itself forever. Give it a stopping case.','En funktion anropar sig själv för evigt. Ge den ett stoppvillkor.');
  if(t==='AttributeError')return L(did?`That method doesn’t exist here. Did you mean ${did[1]}?`:'That method doesn’t exist for this kind of value.',did?`Den metoden finns inte här. Menade du ${did[1]}?`:'Den metoden finns inte för den här sortens värde.');
  if(t==='EOFError')return L('The program asked for input but got none. Type answers in the Program input box, one per line.','Programmet frågade efter input men fick ingen. Skriv svar i rutan Programmets input, ett per rad.');
  if(t==='ModuleNotFoundError')return L('That module isn’t available in Code Quest. You can use random, math and time.','Den modulen finns inte i Code Quest. Du kan använda random, math och time.');
  if(t==='OutputLimit')return L('Your program printed a mountain of text — probably a loop that never stops. Make sure the loop’s question becomes False.','Ditt program skrev ut ett berg av text — troligen en loop som aldrig slutar. Se till att loopens fråga blir False.');
  return L('Read the last line of the error: it says what went wrong and on which line.','Läs sista raden i felet: den säger vad som gick fel och på vilken rad.');
}

{id:'py2',icon:'🎒',title:L('Inventory','Inventariet'),sub:L('Variables: boxes with names','Variabler: lådor med namn'),card:'py_name',steps:[
 {id:'p2a',t:'code',xp:25,title:L('Inventory slots','Inventarieplatser'),
  body:L('<p>A <b>variable</b> is a named box that stores a value. The <code>=</code> sign puts something in the box.</p><pre>weapon = "Fire Sword"\nhealth = 100\nprint(weapon)\nprint(health)</pre><p>Text needs quotes. Numbers don’t.</p>','<p>En <b>variabel</b> är en låda med ett namn som sparar ett värde. Tecknet <code>=</code> lägger något i lådan.</p><pre>weapon = "Fire Sword"\nhealth = 100\nprint(weapon)\nprint(health)</pre><p>Text behöver citattecken. Tal behöver det inte.</p>'),
  goal:L('Make hero = your name and power = 9001. Print hero, then power.','Skapa hero = ditt namn och power = 9001. Skriv ut hero, sedan power.'),hint:L('Two variables, then two print() lines. print(hero) has no quotes — you want the box, not the word.','Två variabler och sedan två print()-rader. print(hero) har inga citattecken — du vill ha lådan, inte ordet.'),

 {id:'p2c',t:'code',xp:25,title:L('Losing a life','Att förlora ett liv'),
  body:L('<p>Variables can change. Python reads the right side first, then stores the answer:</p><pre>gold = 10\ngold = gold + 5\nprint(gold)   # 15</pre><p>Shortcut: <code>gold += 5</code> does the same thing.</p>','<p>Variabler kan ändras. Python läser högersidan först och sparar sedan svaret:</p><pre>gold = 10\ngold = gold + 5\nprint(gold)   # 15</pre><p>Genväg: <code>gold += 5</code> gör samma sak.</p>'),
  goal:L('Start with lives = 3. Remove one life using lives itself, then print lives.','Börja med lives = 3. Ta bort ett liv med hjälp av lives själv och skriv sedan ut lives.'),hint:L('lives = lives - 1  (or lives -= 1)','lives = lives - 1  (eller lives -= 1)'),

 {id:'p2d',t:'predict',xp:10,title:L('Crystal ball','Kristallkulan'),code:'x = 5\nx = x * 2\nx = x + 1\nprint(x)',opts:['5','10','11','12'],a:2,

{id:'py3',icon:'🔢',title:L('The number forge','Sifferssmedjan'),sub:L('Maths, the computer’s superpower','Matte, datorns superkraft'),card:'py_release',steps:[
 {id:'p3a',t:'code',xp:25,title:L('Damage calculator','Skadekalkylatorn'),
  body:L('<p>Python is a very fast calculator:</p><pre>print(10 + 5)   # add\nprint(10 - 5)   # subtract\nprint(4 * 6)    # multiply\nprint(9 / 2)    # divide</pre>','<p>Python är en supersnabb miniräknare:</p><pre>print(10 + 5)   # plus\nprint(10 - 5)   # minus\nprint(4 * 6)    # gånger\nprint(9 / 2)    # delat med</pre>'),
  goal:L('3 swords each deal 15 damage. Print the total damage (let Python do the maths).','3 svärd gör 15 skada var. Skriv ut den totala skadan (låt Python räkna).'),hint:L('print(3 * 15)','print(3 * 15)'),
  starter:'',sol:'print(3 * 15)',ck:all(eq('45'),uses(/\*/))},
 {id:'p3b',t:'predict',xp:10,title:L('Three kinds of divide','Tre sorters division'),code:'print(7 / 2)\nprint(7 // 2)\nprint(7 % 2)',opts:['3.5\n3\n1','3.5\n3.5\n1','3\n3\n1','3.5\n3\n0'],a:0,

 {id:'p3c',t:'code',xp:25,title:L('The doubling hoard','Den fördubblade skatten'),
  body:L('<p>A dragon’s gold doubles every night. After 10 nights, one coin becomes 2×2×2×2×2×2×2×2×2×2. That’s a power: <code>2 ** 10</code>.</p><pre>print(3 ** 2)   # 9</pre>','<p>En drakes guld fördubblas varje natt. Efter 10 nätter blir ett mynt 2×2×2×2×2×2×2×2×2×2. Det är en potens: <code>2 ** 10</code>.</p><pre>print(3 ** 2)   # 9</pre>'),
  goal:L('Print how many coins the dragon has after 10 nights, using **.','Skriv ut hur många mynt draken har efter 10 nätter, med **.'),hint:L('print(2 ** 10)','print(2 ** 10)'),
  starter:'',sol:'print(2 ** 10)',ck:all(eq('1024'),uses(/\*\*/))},
 {id:'p3d',t:'quiz',xp:10,title:L('Leftovers','Rester'),q:L('You share 17 sweets between 5 friends. Which operator tells you how many are left over?','Du delar 17 godisbitar mellan 5 kompisar. Vilken operator visar hur många som blir över?'),opts:['17 / 5','17 // 5','17 % 5','17 ** 5'],a:2,
  why:L('% (modulo) gives the remainder: 17 % 5 is 2. It’s also how programs check for even numbers: n % 2 == 0.','% (modulo) ger resten: 17 % 5 är 2. Det är också så program kollar jämna tal: n % 2 == 0.')},
 {id:'p3e',t:'code',xp:25,title:L('Fair score','Rättvist snitt'),
  body:L('<p>Brackets work like in maths: the inside goes first. <code>round(x, 1)</code> keeps one decimal.</p><pre>print(round(3.14159, 2))   # 3.14</pre>','<p>Parenteser fungerar som i matte: insidan räknas först. <code>round(x, 1)</code> behåller en decimal.</p><pre>print(round(3.14159, 2))   # 3.14</pre>'),
  goal:L('Your scores were 7, 8 and 10. Print the average, rounded to 1 decimal.','Dina poäng var 7, 8 och 10. Skriv ut medelvärdet avrundat till 1 decimal.'),hint:L('Add them in brackets, divide by 3, then wrap it all in round(..., 1).','Addera dem inom parentes, dela med 3 och lägg allt i round(..., 1).'),
  starter:'',sol:'print(round((7 + 8 + 10) / 3, 1))',ck:eq('8.3')},
 {id:'p3f',t:'mystery',xp:60,title:L('The vault code','Valvkoden'),
  body:L('<p><b>Case file #1.</b> The bank vault was found open. The thief dropped a note with three maths clues. Work out each digit with Python, then pick the vault it opens.</p>','<p><b>Ärende #1.</b> Bankvalvet hittades öppet. Tjuven tappade en lapp med tre matteledtrådar. Räkna ut varje siffra med Python och välj sedan valvet den öppnar.</p>'),
  goal:L('Print all three digits, then choose the right vault.','Skriv ut alla tre siffrorna och välj sedan rätt valv.'),hint:L('Use // for clue 1, ** for clue 2 and % for clue 3.','Använd // för ledtråd 1, ** för ledtråd 2 och % för ledtråd 3.'),
  starter:'# Clue 1: the first digit is 17 divided by 7, whole part only\nprint(17 // 7)\n\n# Clue 2: the second digit is 2 to the power of 2\n\n\n# Clue 3: the last digit is the remainder of 100 divided by 3\n',
  sol:'print(17 // 7)\nprint(2 ** 2)\nprint(100 % 3)',opts:['Vault 241','Vault 412','Vault 214','Vault 124'],answer:'Vault 241',pick:L('Open this vault','Öppna valvet'),ck:eq('2\n4\n1')},
]},
{id:'py4',icon:'✒️',title:L('Word smithy','Ordsmedjan'),sub:L('Strings, f-strings and input','Strängar, f-strängar och input'),card:'py_zen',steps:[
 {id:'p4a',t:'code',xp:25,title:L('Magic templates','Magiska mallar'),
  body:L('<p>An <b>f-string</b> is text with holes. Put an <code>f</code> before the quote and variables inside <code>{ }</code>:</p><pre>name = "Ada"\nlevel = 7\nprint(f"{name} reached level {level}!")</pre>','<p>En <b>f-sträng</b> är text med hål. Sätt ett <code>f</code> före citattecknet och variabler inom <code>{ }</code>:</p><pre>name = "Ada"\nlevel = 7\nprint(f"{name} reached level {level}!")</pre>'),
  goal:L('Set hero = "Nova" and gems = 12, then use an f-string to print: Nova has 12 gems','Sätt hero = "Nova" och gems = 12 och använd en f-sträng för att skriva: Nova has 12 gems'),hint:L('print(f"{hero} has {gems} gems")','print(f"{hero} has {gems} gems")'),
  starter:'hero = "Nova"\ngems = 12\n',sol:'hero = "Nova"\ngems = 12\nprint(f"{hero} has {gems} gems")',ck:all(eq('Nova has 12 gems'),uses(/f["']/))},
 {id:'p4b',t:'code',xp:25,title:L('Shout and measure','Skrik och mät'),
  body:L('<p>Text has built-in powers called <b>methods</b>. Use them with a dot:</p><pre>word = "dragon"\nprint(word.upper())    # DRAGON\nprint(len(word))       # 6 letters\nprint(word.replace("d", "w"))</pre>','<p>Text har inbyggda krafter som kallas <b>metoder</b>. Använd dem med en punkt:</p><pre>word = "dragon"\nprint(word.upper())    # DRAGON\nprint(len(word))       # 6 bokstäver\nprint(word.replace("d", "w"))</pre>'),
  goal:L('Set shout = "help". Print it in capitals with a ! after it (HELP!), then print how many letters “wizard” has.','Sätt shout = "help". Skriv ut den med stora bokstäver och ! efter (HELP!), skriv sedan ut hur många bokstäver ”wizard” har.'),hint:L('print(shout.upper() + "!") and print(len("wizard"))','print(shout.upper() + "!") och print(len("wizard"))'),
  starter:'shout = "help"\n',sol:'shout = "help"\nprint(shout.upper() + "!")\nprint(len("wizard"))',ck:all(eq('HELP!\n6'),uses(/upper/),uses(/len\(/))},
 {id:'p4c',t:'predict',xp:10,title:L('Slicing letters','Skära bokstäver'),code:'word = "python"\nprint(word[0], word[-1], word[1:4])',opts:['p n yth','p n pyt','y o yth','p n ytho'],a:0,
  why:L('Counting starts at 0, so word[0] is p. Negative numbers count from the end: word[-1] is n. A slice [1:4] takes positions 1, 2, 3 (it stops before 4).','Räkningen börjar på 0, så word[0] är p. Negativa tal räknar bakifrån: word[-1] är n. En skiva [1:4] tar plats 1, 2, 3 (den stannar före 4).')},
 {id:'p4d',t:'code',xp:30,title:L('The talking gate','Den talande porten'),
  body:L('<p><code>input()</code> asks the player a question and waits for an answer. The answer is always text.</p><pre>colour = input("Favourite colour? ")\nprint(f"{colour} is great!")</pre><p>Type your answers in the <b>Program input</b> box under the editor, one per line.</p>','<p><code>input()</code> ställer en fråga till spelaren och väntar på svar. Svaret är alltid text.</p><pre>colour = input("Favourite colour? ")\nprint(f"{colour} is great!")</pre><p>Skriv dina svar i rutan <b>Programmets input</b> under editorn, ett per rad.</p>'),
  goal:L('Ask “What is your name? ” and greet the player: Welcome, NAME!','Fråga ”What is your name? ” och hälsa spelaren: Welcome, NAMN!'),hint:L('name = input("What is your name? ") then an f-string.','name = input("What is your name? ") och sedan en f-sträng.'),
  inputs:['Mira'],starter:'',sol:'name = input("What is your name? ")\nprint(f"Welcome, {name}!")',ck:all(has('Welcome, Mira!'),uses(/input\(/))},
 {id:'p4e',t:'bug',xp:30,title:L('Birthday bug','Födelsedagsbuggen'),
  body:L('<p>input() always gives you <b>text</b>, even if the player types a number. You can’t add 1 to text — first turn it into a number with <code>int()</code>.</p>','<p>input() ger dig alltid <b>text</b>, även om spelaren skriver ett tal. Man kan inte lägga till 1 på text — gör först om den till ett tal med <code>int()</code>.</p>'),
  goal:L('With input 12, print: Next year you will be 13','Med input 12, skriv: Next year you will be 13'),hint:L('Use int(age) + 1, and put the result in an f-string.','Använd int(age) + 1 och lägg resultatet i en f-sträng.'),

 {id:'p4f',t:'parsons',xp:25,title:L('Mirror words','Spegelord'),
  body:L('<p>A <b>palindrome</b> reads the same backwards, like “level”. <code>word[::-1]</code> flips text around. Put the lines in order.</p>','<p>Ett <b>palindrom</b> läses likadant baklänges, som ”level”. <code>word[::-1]</code> vänder på text. Sätt raderna i ordning.</p>'),

{id:'py5',icon:'⚔️',title:L('Crossroads','Vägskälet'),sub:L('Decisions with if, elif, else','Beslut med if, elif, else'),card:'py_bdfl',steps:[
 {id:'p5a',t:'code',xp:30,title:L('The fork in the road','Vägskälet'),
  body:L('<p><code>if</code> lets your program choose. The indented lines only run when the question is true.</p><pre>health = 50\nif health > 0:\n    print("Still fighting!")\nelse:\n    print("Game over...")</pre><p>Remember the <b>colon</b> and the <b>indent</b> (press Tab).</p>','<p><code>if</code> låter ditt program välja. De indragna raderna körs bara när frågan är sann.</p><pre>health = 50\nif health > 0:\n    print("Still fighting!")\nelse:\n    print("Game over...")</pre><p>Glöm inte <b>kolon</b> och <b>indraget</b> (tryck Tab).</p>'),
  goal:L('level = 12. If level is 10 or more, print Boss fight unlocked! — otherwise Keep training!','level = 12. Om level är 10 eller mer, skriv Boss fight unlocked! — annars Keep training!'),hint:L('Use >= for “10 or more”.','Använd >= för ”10 eller mer”.'),
  starter:'level = 12\n',sol:'level = 12\nif level >= 10:\n    print("Boss fight unlocked!")\nelse:\n    print("Keep training!")',ck:all(eq('Boss fight unlocked!'),uses(/if/),uses(/else/))},
 {id:'p5b',t:'code',xp:30,title:L('Three paths','Tre vägar'),
  body:L('<p><code>elif</code> means “else if”. Python checks from the top and runs only the <b>first</b> true branch.</p><pre>score = 85\nif score >= 90:\n    print("A rank!")\nelif score >= 70:\n    print("B rank!")\nelse:\n    print("Try again!")</pre>','<p><code>elif</code> betyder ”annars om”. Python kollar uppifrån och kör bara den <b>första</b> sanna grenen.</p><pre>score = 85\nif score >= 90:\n    print("A rank!")\nelif score >= 70:\n    print("B rank!")\nelse:\n    print("Try again!")</pre>'),
  goal:L('gold = 75. Print Rich! if 100 or more, Comfortable if 50 or more, otherwise Poor','gold = 75. Skriv Rich! om 100 eller mer, Comfortable om 50 eller mer, annars Poor'),hint:L('Same shape as the example: if, elif, else.','Samma form som exemplet: if, elif, else.'),
  starter:'gold = 75\n',sol:'gold = 75\nif gold >= 100:\n    print("Rich!")\nelif gold >= 50:\n    print("Comfortable")\nelse:\n    print("Poor")',ck:all(eq('Comfortable'),uses(/elif/))},
 {id:'p5c',t:'quiz',xp:10,title:L('One or two?','En eller två?'),q:L('What is the difference between = and == ?','Vad är skillnaden mellan = och == ?'),
  opts:[L('= stores a value, == asks “are these equal?”','= sparar ett värde, == frågar ”är de lika?”'),L('They mean the same','De betyder samma sak'),L('== is a typo','== är ett stavfel'),L('= compares, == stores','= jämför, == sparar')],a:0,

 {id:'p5d',t:'predict',xp:10,title:L('Which door?','Vilken dörr?'),code:'x = 7\nif x > 5 and x < 10:\n    print("A")\nelif x > 5:\n    print("B")\nelse:\n    print("C")',opts:['A','B','A\nB','C'],a:0,

{id:'py6',icon:'🔄',title:L('The grind','Grindandet'),sub:L('Loops: for, while, break','Loopar: for, while, break'),card:'py_three',steps:[
 {id:'p6a',t:'code',xp:30,title:L('XP grind','XP-grind'),
  body:L('<p>A <code>for</code> loop repeats code. <code>range(1, 6)</code> counts 1, 2, 3, 4, 5 — it stops <b>before</b> the last number.</p><pre>for i in range(1, 4):\n    print("Swing", i)</pre>','<p>En <code>for</code>-loop upprepar kod. <code>range(1, 6)</code> räknar 1, 2, 3, 4, 5 — den stannar <b>före</b> sista talet.</p><pre>for i in range(1, 4):\n    print("Swing", i)</pre>'),
  goal:L('Print the numbers 1 to 5, each on its own line, with a loop.','Skriv ut talen 1 till 5, ett per rad, med en loop.'),hint:L('for i in range(1, 6):','for i in range(1, 6):'),
  starter:'',sol:'for i in range(1, 6):\n    print(i)',ck:all(eq('1\n2\n3\n4\n5'),uses(/for/))},
 {id:'p6b',t:'code',xp:30,title:L('Countdown','Nedräkning'),
  body:L('<p>range can count backwards with a third number, the <b>step</b>:</p><pre>for n in range(10, 0, -2):\n    print(n)    # 10 8 6 4 2</pre>','<p>range kan räkna baklänges med ett tredje tal, <b>steget</b>:</p><pre>for n in range(10, 0, -2):\n    print(n)    # 10 8 6 4 2</pre>'),
  goal:L('Print 5, 4, 3, 2, 1 with a loop, then Go! after the loop.','Skriv 5, 4, 3, 2, 1 med en loop och sedan Go! efter loopen.'),hint:L('range(5, 0, -1). The final print is NOT indented.','range(5, 0, -1). Sista print är INTE indragen.'),
  starter:'',sol:'for n in range(5, 0, -1):\n    print(n)\nprint("Go!")',ck:all(eq('5\n4\n3\n2\n1\nGo!'),uses(/for/))},
 {id:'p6c',t:'predict',xp:10,title:L('Piggy bank','Spargrisen'),code:'total = 0\nfor i in range(1, 5):\n    total += i\nprint(total)',opts:['10','15','4','1\n3\n6\n10'],a:0,
  why:L('range(1, 5) is 1, 2, 3, 4. Adding them: 1+2+3+4 = 10. The print is outside the loop, so it only runs once.','range(1, 5) är 1, 2, 3, 4. Summan: 1+2+3+4 = 10. Print ligger utanför loopen, så den körs bara en gång.')},
 {id:'p6d',t:'bug',xp:30,title:L('The endless training','Den eviga träningen'),
  body:L('<p>A <code>while</code> loop runs while its question is true. This one never stops — the program froze! Make energy go down each time.</p>','<p>En <code>while</code>-loop kör så länge frågan är sann. Den här stannar aldrig — programmet frös! Se till att energy minskar varje varv.</p>'),
  goal:L('Print Training... three times, then Rest time','Skriv Training... tre gånger, sedan Rest time'),hint:L('Inside the loop add: energy -= 1','Lägg till i loopen: energy -= 1'),
  starter:'energy = 3\nwhile energy > 0:\n    print("Training...")\nprint("Rest time")',sol:'energy = 3\nwhile energy > 0:\n    print("Training...")\n    energy -= 1\nprint("Rest time")',ck:eq('Training...\nTraining...\nTraining...\nRest time')},
 {id:'p6e',t:'code',xp:30,title:L('Hunt for seven','Jakten på sjuan'),
  body:L('<p><code>break</code> jumps out of a loop straight away — perfect when you’ve found what you were looking for.</p><pre>for n in range(1, 100):\n    if n * n > 50:\n        print(n)\n        break</pre>','<p><code>break</code> hoppar ur en loop direkt — perfekt när du har hittat det du letade efter.</p><pre>for n in range(1, 100):\n    if n * n > 50:\n        print(n)\n        break</pre>'),
  goal:L('Find and print the first number above 50 that divides evenly by 7. Stop with break.','Hitta och skriv ut första talet över 50 som är jämnt delbart med 7. Stoppa med break.'),hint:L('Loop range(51, 100); check n % 7 == 0.','Loopa range(51, 100); kolla n % 7 == 0.'),
  starter:'',sol:'for n in range(51, 100):\n    if n % 7 == 0:\n        print(n)\n        break',ck:all(eq('56'),uses(/break/))},
 {id:'p6f',t:'parsons',xp:25,title:L('Times table','Multiplikationstabellen'),
  body:L('<p>Indentation is part of the order here — the lines inside the loop are pushed to the right.</p>','<p>Indraget är en del av ordningen här — raderna inuti loopen är flyttade åt höger.</p>'),
  goal:L('Print the 3 times table from 3 x 1 to 3 x 5.','Skriv ut 3:ans tabell från 3 x 1 till 3 x 5.'),
  lines:['for i in range(1, 6):','    result = 3 * i','    print(f"3 x {i} = {result}")'],distract:['for i in range(1, 5):'],ck:eq('3 x 1 = 3\n3 x 2 = 6\n3 x 3 = 9\n3 x 4 = 12\n3 x 5 = 15')},
 {id:'p6g',t:'boss',xp:80,title:L('Boss: the FizzBuzz dragon','Boss: FizzBuzz-draken'),
  body:L('<p>The legendary dragon only lets you pass if you can chant its song. Print 1 to 20, but:</p><p>• multiples of 3 → <code>Fizz</code><br>• multiples of 5 → <code>Buzz</code><br>• multiples of both → <code>FizzBuzz</code><br>• anything else → the number</p><p>Real programmers get asked this in job interviews!</p>','<p>Den legendariska draken släpper bara förbi dig om du kan dess sång. Skriv 1 till 20, men:</p><p>• delbart med 3 → <code>Fizz</code><br>• delbart med 5 → <code>Buzz</code><br>• delbart med båda → <code>FizzBuzz</code><br>• annars → talet</p><p>Riktiga programmerare får den här frågan på jobbintervjuer!</p>'),
  goal:L('Print FizzBuzz from 1 to 20.','Skriv FizzBuzz från 1 till 20.'),hint:L('Check “both” first: i % 15 == 0. Then 3, then 5, then else.','Kolla ”båda” först: i % 15 == 0. Sedan 3, sedan 5, sedan else.'),
  starter:'for i in range(1, 21):\n    pass  # replace this line\n',sol:'for i in range(1, 21):\n    if i % 15 == 0:\n        print("FizzBuzz")\n    elif i % 3 == 0:\n        print("Fizz")\n    elif i % 5 == 0:\n        print("Buzz")\n    else:\n        print(i)',
  ck:eq('1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz\n16\n17\nFizz\n19\nBuzz')},
]},
{id:'py7',icon:'🧙',title:L('Party up','Samla laget'),sub:L('Lists hold many things','Listor rymmer många saker'),card:'py_science',steps:[
 {id:'p7a',t:'code',xp:30,title:L('Assemble the party','Samla gruppen'),
  body:L('<p>A <b>list</b> keeps many values in order, inside square brackets:</p><pre>party = ["Warrior", "Mage"]\nparty.append("Healer")   # add to the end\nprint(party)\nprint(len(party))        # 3</pre>','<p>En <b>lista</b> håller många värden i ordning, inom hakparenteser:</p><pre>party = ["Warrior", "Mage"]\nparty.append("Healer")   # lägg till sist\nprint(party)\nprint(len(party))        # 3</pre>'),
  goal:L('Make a list team with 3 names, append a 4th, then print the list.','Gör en lista team med 3 namn, lägg till ett 4:e med append och skriv ut listan.'),hint:L('team = ["Aria", "Bolt", "Cinder"] then team.append("Drake")','team = ["Aria", "Bolt", "Cinder"] och sedan team.append("Drake")'),
  starter:'',sol:'team = ["Aria", "Bolt", "Cinder"]\nteam.append("Drake")\nprint(team)',ck:all(o=>/^\[.+\]$/.test(norm(o))&&norm(o).split(',').length===4,uses(/append/))},
 {id:'p7b',t:'predict',xp:10,title:L('Bag check','Väskkollen'),code:'items = ["sword", "shield", "potion"]\nprint(items[1])\nprint(items[-1])\nprint(len(items))',opts:['shield\npotion\n3','sword\npotion\n3','shield\nsword\n3','shield\npotion\n2'],a:0,
  why:L('Lists start counting at 0, so items[1] is the second thing: shield. items[-1] is the last: potion.','Listor börjar räkna på 0, så items[1] är den andra saken: shield. items[-1] är den sista: potion.')},
 {id:'p7c',t:'code',xp:30,title:L('Roll call','Upprop'),
  body:L('<p>A for loop can walk through a list, one item at a time:</p><pre>loot = ["gem", "key", "map"]\nfor item in loot:\n    print("Found a", item)</pre>','<p>En for-loop kan gå igenom en lista, en sak i taget:</p><pre>loot = ["gem", "key", "map"]\nfor item in loot:\n    print("Found a", item)</pre>'),
  goal:L('For each hero in party = ["Aria", "Bolt", "Cinder"] print: NAME is ready!','För varje hjälte i party = ["Aria", "Bolt", "Cinder"] skriv: NAMN is ready!'),hint:L('for hero in party: then an f-string.','for hero in party: och sedan en f-sträng.'),
  starter:'party = ["Aria", "Bolt", "Cinder"]\n',sol:'party = ["Aria", "Bolt", "Cinder"]\nfor hero in party:\n    print(f"{hero} is ready!")',ck:all(eq('Aria is ready!\nBolt is ready!\nCinder is ready!'),uses(/for/))},
 {id:'p7d',t:'code',xp:30,title:L('Leaderboard','Topplistan'),
  body:L('<p>Python has helpers for lists of numbers:</p><pre>nums = [4, 9, 2]\nprint(max(nums))      # 9\nprint(min(nums))      # 2\nprint(sum(nums))      # 15\nprint(sorted(nums))   # [2, 4, 9]</pre>','<p>Python har hjälpare för listor med tal:</p><pre>nums = [4, 9, 2]\nprint(max(nums))      # 9\nprint(min(nums))      # 2\nprint(sum(nums))      # 15\nprint(sorted(nums))   # [2, 4, 9]</pre>'),
  goal:L('For scores = [42, 17, 99, 63] print the highest, lowest, total, then the sorted list.','För scores = [42, 17, 99, 63] skriv ut högsta, lägsta, summan och sedan den sorterade listan.'),hint:L('Four print lines: max, min, sum, sorted.','Fyra print-rader: max, min, sum, sorted.'),
  starter:'scores = [42, 17, 99, 63]\n',sol:'scores = [42, 17, 99, 63]\nprint(max(scores))\nprint(min(scores))\nprint(sum(scores))\nprint(sorted(scores))',ck:eq('99\n17\n221\n[17, 42, 63, 99]')},
 {id:'p7e',t:'bug',xp:25,title:L('The missing fourth','Den saknade fjärde'),
  body:L('<p>“list index out of range” means you asked for a spot that doesn’t exist. A list of 3 has spots 0, 1 and 2.</p>','<p>”list index out of range” betyder att du bad om en plats som inte finns. En lista med 3 saker har platserna 0, 1 och 2.</p>'),
  goal:L('Print the last member of the team: Cinder','Skriv ut sista medlemmen i laget: Cinder'),hint:L('Use team[2] or team[-1].','Använd team[2] eller team[-1].'),
  starter:'team = ["Aria", "Bolt", "Cinder"]\nprint(team[3])',sol:'team = ["Aria", "Bolt", "Cinder"]\nprint(team[-1])',ck:eq('Cinder')},
 {id:'p7f',t:'code',xp:35,title:L('Count the champions','Räkna mästarna'),
  body:L('<p>A classic pattern: start a <b>counter</b> at 0 and add 1 every time something matches.</p><pre>count = 0\nfor n in [3, 8, 1, 9]:\n    if n > 5:\n        count += 1\nprint(count)   # 2</pre>','<p>Ett klassiskt mönster: starta en <b>räknare</b> på 0 och lägg till 1 varje gång något matchar.</p><pre>count = 0\nfor n in [3, 8, 1, 9]:\n    if n > 5:\n        count += 1\nprint(count)   # 2</pre>'),
  goal:L('Count how many scores in [42, 17, 99, 63, 55, 8] are above 50, and print the count.','Räkna hur många poäng i [42, 17, 99, 63, 55, 8] som är över 50 och skriv ut antalet.'),hint:L('Same pattern as the example, with your list and > 50.','Samma mönster som exemplet, med din lista och > 50.'),
  starter:'scores = [42, 17, 99, 63, 55, 8]\n',sol:'scores = [42, 17, 99, 63, 55, 8]\ncount = 0\nfor s in scores:\n    if s > 50:\n        count += 1\nprint(count)',ck:all(eq('3'),uses(/for/))},
]},
{id:'py8',icon:'✨',title:L('The spellbook','Trollboken'),sub:L('Functions: make your own commands','Funktioner: gör egna kommandon'),card:'py_popular',steps:[
 {id:'p8a',t:'code',xp:35,title:L('Special ability','Specialförmåga'),
  body:L('<p>A <b>function</b> is a spell you write once and cast many times. <code>def</code> creates it; calling its name runs it.</p><pre>def battle_cry(name):\n    print(name + " attacks!")\n\nbattle_cry("Knight")\nbattle_cry("Ogre")</pre>','<p>En <b>funktion</b> är en besvärjelse du skriver en gång och använder många gånger. <code>def</code> skapar den; när du skriver namnet körs den.</p><pre>def battle_cry(name):\n    print(name + " attacks!")\n\nbattle_cry("Knight")\nbattle_cry("Ogre")</pre>'),
  goal:L('Make power_up(hero, level) that prints: HERO leveled up to LEVEL! Call it with any name and 5.','Gör power_up(hero, level) som skriver: HERO leveled up to LEVEL! Anropa den med valfritt namn och 5.'),hint:L('Inside the function: print(f"{hero} leveled up to {level}!")','Inuti funktionen: print(f"{hero} leveled up to {level}!")'),
  starter:'# Create your ability\n\n\n# Use it\n',sol:'def power_up(hero, level):\n    print(f"{hero} leveled up to {level}!")\n\npower_up("Aria", 5)',ck:all(has('leveled up to 5!'),uses(/def power_up/))},
 {id:'p8b',t:'code',xp:35,title:L('Loot returns','Bytet kommer tillbaka'),
  body:L('<p><code>return</code> hands a value back to whoever called the function. You can store it or print it.</p><pre>def triple(n):\n    return n * 3\n\nbig = triple(4)\nprint(big)    # 12</pre>','<p><code>return</code> lämnar tillbaka ett värde till den som anropade funktionen. Du kan spara det eller skriva ut det.</p><pre>def triple(n):\n    return n * 3\n\nbig = triple(4)\nprint(big)    # 12</pre>'),
  goal:L('Make heal(hp, amount) that returns the two added together. Print heal(50, 30).','Gör heal(hp, amount) som returnerar summan av dem. Skriv ut heal(50, 30).'),hint:L('return hp + amount','return hp + amount'),
  starter:'',sol:'def heal(hp, amount):\n    return hp + amount\n\nprint(heal(50, 30))',ck:all(eq('80'),uses(/return/))},
 {id:'p8c',t:'predict',xp:10,title:L('Double trouble','Dubbelt trubbel'),code:'def double(n):\n    return n * 2\n\nprint(double(double(3)))',opts:['12','6','9','3'],a:0,
  why:L('The inside goes first: double(3) is 6. Then double(6) is 12.','Insidan räknas först: double(3) är 6. Sedan är double(6) lika med 12.')},
 {id:'p8d',t:'bug',xp:30,title:L('The vanishing answer','Svaret som försvann'),
  body:L('<p>This function calculates an area but prints <code>None</code>. A function without <code>return</code> gives back nothing (None).</p>','<p>Den här funktionen räknar ut en area men skriver <code>None</code>. En funktion utan <code>return</code> ger inget tillbaka (None).</p>'),
  goal:L('Make it print 20.','Få den att skriva 20.'),hint:L('Put return in front of w * h.','Sätt return framför w * h.'),
  starter:'def area(w, h):\n    w * h\n\nprint(area(4, 5))',sol:'def area(w, h):\n    return w * h\n\nprint(area(4, 5))',ck:eq('20')},
 {id:'p8e',t:'code',xp:35,title:L('Polite spells','Artiga besvärjelser'),
  body:L('<p>Parameters can have a <b>default value</b> that is used when you leave them out:</p><pre>def hit(target, damage=10):\n    print(f"{target} takes {damage}")\n\nhit("Orc")        # Orc takes 10\nhit("Troll", 25)  # Troll takes 25</pre>','<p>Parametrar kan ha ett <b>standardvärde</b> som används när du hoppar över dem:</p><pre>def hit(target, damage=10):\n    print(f"{target} takes {damage}")\n\nhit("Orc")        # Orc takes 10\nhit("Troll", 25)  # Troll takes 25</pre>'),
  goal:L('Make greet(name, greeting="Hello") printing GREETING, NAME! Call greet("Ada") and greet("Bo", "Hej").','Gör greet(name, greeting="Hello") som skriver GREETING, NAME! Anropa greet("Ada") och greet("Bo", "Hej").'),hint:L('print(f"{greeting}, {name}!")','print(f"{greeting}, {name}!")'),
  starter:'',sol:'def greet(name, greeting="Hello"):\n    print(f"{greeting}, {name}!")\n\ngreet("Ada")\ngreet("Bo", "Hej")',ck:eq('Hello, Ada!\nHej, Bo!')},
 {id:'p8f',t:'code',xp:40,title:L('The even sieve','Den jämna silen'),
  body:L('<p>Functions can return <code>True</code> or <code>False</code>. Then you can use them in an if:</p><pre>def is_big(n):\n    return n > 100\n\nif is_big(250):\n    print("Huge!")</pre>','<p>Funktioner kan returnera <code>True</code> eller <code>False</code>. Då kan du använda dem i en if:</p><pre>def is_big(n):\n    return n > 100\n\nif is_big(250):\n    print("Huge!")</pre>'),
  goal:L('Write is_even(n). Use it in a loop to print only the even numbers from 1 to 10.','Skriv is_even(n). Använd den i en loop för att bara skriva ut de jämna talen 1–10.'),hint:L('return n % 2 == 0','return n % 2 == 0'),
  starter:'def is_even(n):\n    pass\n\n',sol:'def is_even(n):\n    return n % 2 == 0\n\nfor i in range(1, 11):\n    if is_even(i):\n        print(i)',ck:all(eq('2\n4\n6\n8\n10'),uses(/def is_even/),uses(/is_even\(i|is_even\(n|is_even\(x|is_even\(\w+\)\s*:/))},
]},
{id:'py9',icon:'🗺️',title:L('Treasure maps','Skattkartor'),sub:L('Dictionaries: look things up by name','Dictionaries: slå upp saker med namn'),card:'py_pypi',steps:[
 {id:'p9a',t:'code',xp:35,title:L('Character sheet','Karaktärsbladet'),
  body:L('<p>A <b>dictionary</b> stores pairs: a <b>key</b> and its <b>value</b>. Look things up with the key in square brackets.</p><pre>hero = {"name": "Ada", "hp": 100}\nprint(hero["name"])     # Ada\nhero["hp"] = hero["hp"] - 10</pre>','<p>En <b>dictionary</b> sparar par: en <b>nyckel</b> och dess <b>värde</b>. Slå upp med nyckeln inom hakparenteser.</p><pre>hero = {"name": "Ada", "hp": 100}\nprint(hero["name"])     # Ada\nhero["hp"] = hero["hp"] - 10</pre>'),
  goal:L('Print the hero’s name. Then lower hp by 25 and print hp.','Skriv ut hjältens namn. Minska sedan hp med 25 och skriv ut hp.'),hint:L('hero["hp"] -= 25','hero["hp"] -= 25'),
  starter:'hero = {"name": "Ada", "hp": 100}\n',sol:'hero = {"name": "Ada", "hp": 100}\nprint(hero["name"])\nhero["hp"] -= 25\nprint(hero["hp"])',ck:eq('Ada\n75')},
 {id:'p9b',t:'code',xp:35,title:L('The shop','Butiken'),

  goal:L('For each item in the shop print: ITEM costs PRICE gold','För varje sak i butiken skriv: ITEM costs PRICE gold'),hint:L('for item, price in prices.items():','for item, price in prices.items():'),
  starter:'prices = {"potion": 5, "sword": 50, "map": 12}\n',sol:'prices = {"potion": 5, "sword": 50, "map": 12}\nfor item, price in prices.items():\n    print(f"{item} costs {price} gold")',ck:eq('potion costs 5 gold\nsword costs 50 gold\nmap costs 12 gold')},
 {id:'p9c',t:'predict',xp:10,title:L('Changing the map','Ändra kartan'),code:'d = {"a": 1}\nd["b"] = 2\nd["a"] += 10\nprint(d)',opts:["{'a': 11, 'b': 2}","{'a': 1, 'b': 2}","{'a': 11}","{'b': 2, 'a': 11}"],a:0,
  why:L('Writing to a new key adds it. Writing to an existing key changes it. Dictionaries remember the order keys were added.','Att skriva till en ny nyckel lägger till den. Att skriva till en befintlig nyckel ändrar den. Dictionaries minns ordningen nycklarna lades till.')},
 {id:'p9d',t:'code',xp:40,title:L('Word counter','Ordräknaren'),
  body:L('<p><code>d.get(key, 0)</code> gives the value, or 0 if the key isn’t there yet. Perfect for counting!</p><pre>counts = {}\nfor fruit in ["apple", "fig", "apple"]:\n    counts[fruit] = counts.get(fruit, 0) + 1\nprint(counts)   # {\'apple\': 2, \'fig\': 1}</pre>','<p><code>d.get(key, 0)</code> ger värdet, eller 0 om nyckeln inte finns än. Perfekt för att räkna!</p><pre>counts = {}\nfor fruit in ["apple", "fig", "apple"]:\n    counts[fruit] = counts.get(fruit, 0) + 1\nprint(counts)   # {\'apple\': 2, \'fig\': 1}</pre>'),

 {id:'p9e',t:'mystery',xp:70,title:L('The museum heist','Museikuppen'),
  body:L('<p><b>Case file #3.</b> The Star Gem was stolen from the <b>Gems</b> room at <b>14:30</b>. The guard’s log shows when each visitor entered and left each room (as numbers: 1430 means 14:30).</p><p>Loop through the log and print everyone who was in the Gems room at 1430.</p>','<p><b>Ärende #3.</b> Stjärnädelstenen stals från rummet <b>Gems</b> klockan <b>14:30</b>. Vaktens logg visar när varje besökare gick in och ut ur varje rum (som tal: 1430 betyder 14:30).</p><p>Loopa genom loggen och skriv ut alla som var i Gems-rummet klockan 1430.</p>'),

{id:'py10',icon:'🐉',title:L('Dragon’s peak','Drakens topp'),sub:L('Games with random, input and try','Spel med random, input och try'),card:'py_future',steps:[
 {id:'p10a',t:'code',xp:40,title:L('Dice of fate','Ödets tärningar'),
  body:L('<p><code>import random</code> loads Python’s randomness toolbox. <code>random.randint(1, 6)</code> rolls a die.</p><pre>import random\nroll = random.randint(1, 6)\nprint("You rolled", roll)</pre><p>Run it a few times — the answer changes!</p>','<p><code>import random</code> laddar Pythons slumpverktyg. <code>random.randint(1, 6)</code> slår en tärning.</p><pre>import random\nroll = random.randint(1, 6)\nprint("You rolled", roll)</pre><p>Kör några gånger — svaret ändras!</p>'),
  goal:L('Roll three dice with a loop and print each roll (a number 1–6) on its own line.','Slå tre tärningar med en loop och skriv ut varje slag (ett tal 1–6) på en egen rad.'),hint:L('for i in range(3): then print(random.randint(1, 6))','for i in range(3): och sedan print(random.randint(1, 6))'),
  starter:'import random\n',sol:'import random\nfor i in range(3):\n    print(random.randint(1, 6))',ck:all(o=>{const l=norm(o).split('\n');return l.length===3&&l.every(x=>/^[1-6]$/.test(x));},uses(/randint/))},
 {id:'p10b',t:'code',xp:50,title:L('Guess my number','Gissa mitt tal'),
  body:L('<p>Time for a real game! A <code>while</code> loop keeps asking until the guess is right.</p><pre>secret = 7\nguess = 0\nwhile guess != secret:\n    guess = int(input("Guess: "))</pre><p>The test input is 3, 9, 7. Try your own numbers too!</p>','<p>Dags för ett riktigt spel! En <code>while</code>-loop fortsätter fråga tills gissningen är rätt.</p><pre>secret = 7\nguess = 0\nwhile guess != secret:\n    guess = int(input("Guess: "))</pre><p>Testinput är 3, 9, 7. Prova egna tal också!</p>'),
  goal:L('After each guess print Too low or Too high. When right, print: You got it in N tries!','Efter varje gissning skriv Too low eller Too high. När den är rätt, skriv: You got it in N tries!'),hint:L('Keep a tries counter. Inside the loop: if guess < secret / elif guess > secret.','Ha en räknare tries. I loopen: if guess < secret / elif guess > secret.'),
  inputs:['3','9','7'],starter:'secret = 7\nguess = 0\ntries = 0\n',sol:'secret = 7\nguess = 0\ntries = 0\nwhile guess != secret:\n    guess = int(input("Guess: "))\n    tries += 1\n    if guess < secret:\n        print("Too low")\n    elif guess > secret:\n        print("Too high")\nprint(f"You got it in {tries} tries!")',ck:all(has('Too low','Too high','You got it in 3 tries!'),uses(/while/))},
 {id:'p10c',t:'bug',xp:40,title:L('The crash shield','Kraschskölden'),
  body:L('<p>If a player types letters, <code>int()</code> crashes the game. A <code>try</code>/<code>except</code> block catches the error so you can respond nicely.</p><pre>try:\n    n = int("abc")\nexcept ValueError:\n    print("Oops!")</pre>','<p>Om spelaren skriver bokstäver kraschar <code>int()</code> spelet. Ett <code>try</code>/<code>except</code>-block fångar felet så att du kan svara snällt.</p><pre>try:\n    n = int("abc")\nexcept ValueError:\n    print("Oops!")</pre>'),
  goal:L('With input “dragon”, print That\'s not a number! instead of crashing.','Med input ”dragon”, skriv That\'s not a number! i stället för att krascha.'),hint:L('Wrap the two lines in try:, then add except ValueError:','Lägg de två raderna i try: och lägg till except ValueError:'),
  inputs:['dragon'],starter:'age = int(input("How old are you? "))\nprint(f"In 10 years you will be {age + 10}")',sol:'try:\n    age = int(input("How old are you? "))\n    print(f"In 10 years you will be {age + 10}")\nexcept ValueError:\n    print("That\'s not a number!")',ck:all(has("That's not a number!"),uses(/except/))},
 {id:'p10d',t:'boss',xp:100,title:L('Boss: the dragon’s cipher','Boss: drakens chiffer'),
  body:L('<p>The dragon’s final secret is written in a <b>Caesar cipher</b>: every letter was moved 3 steps forward in the alphabet (A→D, B→E…). Move each letter 3 steps <b>back</b> to read it.</p><p>Every letter has a number: <code>ord("A")</code> is 65 and <code>chr(65)</code> is "A". Letters past A wrap around to the end, so use <code>% 26</code>.</p><pre>shifted = (ord(ch) - 65 - 3) % 26 + 65</pre><p>Julius Caesar really used this code 2000 years ago!</p>','<p>Drakens sista hemlighet är skriven med ett <b>Caesarchiffer</b>: varje bokstav flyttades 3 steg framåt i alfabetet (A→D, B→E…). Flytta varje bokstav 3 steg <b>bakåt</b> för att läsa den.</p><p>Varje bokstav har ett nummer: <code>ord("A")</code> är 65 och <code>chr(65)</code> är "A". Bokstäver före A slår runt till slutet, så använd <code>% 26</code>.</p><pre>shifted = (ord(ch) - 65 - 3) % 26 + 65</pre><p>Julius Caesar använde faktiskt den här koden för 2000 år sedan!</p>'),
  goal:L('Decode KHOOR GUDJRQ and print the message. Keep spaces as spaces.','Avkoda KHOOR GUDJRQ och skriv ut meddelandet. Behåll mellanslag.'),hint:L('Build a new string: loop over each ch; if ch == " " add a space, else add chr(shifted).','Bygg en ny sträng: loopa över varje ch; om ch == " " lägg till mellanslag, annars chr(shifted).'),
  starter:'secret = "KHOOR GUDJRQ"\nmessage = ""\n\nfor ch in secret:\n    pass  # decode each letter here\n\nprint(message)\n',sol:'secret = "KHOOR GUDJRQ"\nmessage = ""\nfor ch in secret:\n    if ch == " ":\n        message += " "\n    else:\n        message += chr((ord(ch) - 65 - 3) % 26 + 65)\nprint(message)',ck:all(eq('HELLO DRAGON'),uses(/chr\(/))},
]},
];

{id:'rs1',icon:'🦀',title:L('Hello, Rustacean','Hej, Rustacean'),sub:L('fn main and println!','fn main och println!'),card:'rs_elevator',steps:[
 {id:'r1a',t:'code',xp:20,title:L('The first claw-snap','Det första klosmället'),
  body:L('<p>Every Rust program starts inside <code>fn main() { }</code>. To show text, use <code>println!</code> — and end the line with a <b>semicolon</b>.</p><pre>fn main() {\n    println!("Hi there!");\n}</pre>','<p>Varje Rust-program börjar inuti <code>fn main() { }</code>. För att visa text använder du <code>println!</code> — och avslutar raden med <b>semikolon</b>.</p><pre>fn main() {\n    println!("Hej där!");\n}</pre>'),
  goal:L('Print exactly: Hello, Rustacean!','Skriv ut exakt: Hello, Rustacean!'),hint:L('println!("Hello, Rustacean!"); goes between the curly braces.','println!("Hello, Rustacean!"); ska stå mellan måsvingarna.'),

 {id:'r1b',t:'quiz',xp:10,title:L('The exclamation mark','Utropstecknet'),q:L('Why does println! have a ! at the end?','Varför har println! ett ! på slutet?'),
  opts:[L('It is a macro: code that writes more code','Det är ett makro: kod som skriver mer kod'),L('It means the text is shouted','Det betyder att texten skriks'),L('It marks an error','Det markerar ett fel'),L('It makes the program faster','Det gör programmet snabbare')],a:0,
  why:L('The ! tells you println! is a macro. Macros expand into bigger code before your program runs — that is how println! can check your {} placeholders.','! visar att println! är ett makro. Makron blir till större kod innan programmet körs — det är så println! kan kontrollera dina {}-platser.')},
 {id:'r1c',t:'bug',xp:25,title:L('Missing pieces','Saknade bitar'),
  body:L('<p>The Rust compiler reads your whole program <b>before</b> it runs. If anything is wrong, nothing runs at all — but it tells you exactly where to look.</p><p>This program has two bugs. Fix them one at a time.</p>','<p>Rust-kompilatorn läser hela programmet <b>innan</b> det körs. Om något är fel körs ingenting — men den säger exakt var du ska titta.</p><p>Programmet har två buggar. Fixa dem en i taget.</p>'),
  goal:L('Print Ready, Set, Go! on three lines.','Skriv Ready, Set, Go! på tre rader.'),hint:L('One line needs a semicolon at the end. Another println is missing its !','En rad behöver semikolon på slutet. En annan println saknar sitt !'),

 {id:'r1d',t:'predict',xp:10,title:L('Crystal claw','Kristallklon'),code:M('println!("{} + {} = {}", 2, 3, 2 + 3);'),opts:['2 + 3 = 5','{} + {} = {}','5','2 3 5'],a:0,

 {id:'r1e',t:'code',xp:20,title:L('Count the legs','Räkna benen'),
  body:L('<p>Use <code>{}</code> as a placeholder, then give the value after a comma:</p><pre>println!("I am {} years old", 12);</pre><p>Fun fact: crabs have 8 walking legs plus 2 claws.</p>','<p>Använd <code>{}</code> som platshållare och ge värdet efter ett komma:</p><pre>println!("I am {} years old", 12);</pre><p>Kul fakta: krabbor har 8 gångben plus 2 klor.</p>'),

 {id:'r1f',t:'parsons',xp:20,title:L('Launch the crab rocket','Skjut upp krabbraketen'),

{id:'rs2',icon:'🔒',title:L('Let it be','Let it be'),sub:L('Variables and mut','Variabler och mut'),card:'rs_name',steps:[
 {id:'r2a',t:'code',xp:25,title:L('Name your treasure','Namnge din skatt'),
  body:L('<p>Rust uses <code>let</code> to create a variable. You can put a variable’s name right inside the braces:</p><pre>let weapon = "Claw Hammer";\nlet health = 100;\nprintln!("{weapon}");\nprintln!("{}", health);</pre>','<p>Rust använder <code>let</code> för att skapa en variabel. Du kan skriva variabelns namn direkt inuti klamrarna:</p><pre>let weapon = "Claw Hammer";\nlet health = 100;\nprintln!("{weapon}");\nprintln!("{}", health);</pre>'),
  goal:L('Make hero = your name and power = 9001. Print hero, then power.','Skapa hero = ditt namn och power = 9001. Skriv ut hero, sedan power.'),hint:L('let hero = "Pixel"; then let power = 9001; then two println! lines.','let hero = "Pixel"; sedan let power = 9001; och två println!-rader.'),
  starter:M(''),sol:M('let hero = "Pixel";\nlet power = 9001;\nprintln!("{hero}");\nprintln!("{power}");'),ck:all(lines(2),o=>norm(o).split('\n')[1]==='9001',uses(/let hero/))},
 {id:'r2b',t:'code',xp:25,title:L('Changing your mind','Ändra sig'),
  body:L('<p>Here’s Rust’s big surprise: variables <b>can’t change</b> unless you say so with <code>mut</code> (short for mutable).</p><pre>let mut gold = 10;\ngold += 5;\nprintln!("{gold}");   // 15</pre>','<p>Här är Rusts stora överraskning: variabler <b>kan inte ändras</b> om du inte säger det med <code>mut</code> (kort för mutable, föränderlig).</p><pre>let mut gold = 10;\ngold += 5;\nprintln!("{gold}");   // 15</pre>'),
  goal:L('Start with 3 lives. Lose one with -= and print lives.','Börja med 3 liv. Förlora ett med -= och skriv ut lives.'),hint:L('let mut lives = 3;','let mut lives = 3;'),
  starter:M(''),sol:M('let mut lives = 3;\nlives -= 1;\nprintln!("{lives}");'),ck:all(eq('2'),uses(/let mut/))},
 {id:'r2c',t:'bug',xp:25,title:L('The frozen score','Den frusna poängen'),
  body:L('<p>Run this and read error <b>E0384</b>. The compiler is protecting you: it thinks you changed something by accident.</p>','<p>Kör och läs felet <b>E0384</b>. Kompilatorn skyddar dig: den tror att du ändrade något av misstag.</p>'),
  goal:L('Fix it so it prints 10.','Fixa så att den skriver 10.'),hint:L('Add mut after let.','Lägg till mut efter let.'),
  starter:M('let score = 0;\nscore = score + 10;\nprintln!("{score}");'),sol:M('let mut score = 0;\nscore = score + 10;\nprintln!("{score}");'),ck:eq('10')},
 {id:'r2d',t:'predict',xp:10,title:L('Shadow play','Skuggspel'),code:M('let x = 5;\nlet x = x + 1;\n{\n    let x = x * 2;\n    println!("{x}");\n}\nprintln!("{x}");'),opts:['12\n6','12\n12','6\n6','10\n6'],a:0,
  why:L('A new let with the same name makes a new variable that “shadows” the old one. Inside the { } block x is 12, but when the block ends that shadow disappears and x is 6 again.','En ny let med samma namn skapar en ny variabel som ”skuggar” den gamla. Inuti { }-blocket är x 12, men när blocket slutar försvinner skuggan och x är 6 igen.')},
 {id:'r2e',t:'quiz',xp:10,title:L('Locked by default','Låst från början'),q:L('Why are Rust variables locked (immutable) by default?','Varför är variabler i Rust låsta (oföränderliga) från början?'),
  opts:[L('So values don’t change by surprise, which prevents bugs','Så att värden inte ändras av misstag, vilket förhindrar buggar'),L('To save electricity','För att spara el'),L('Because Rust is old','För att Rust är gammalt'),L('It’s a mistake in the language','Det är ett misstag i språket')],a:0,
  why:L('When a value can’t change, you and the compiler know it will stay the same. You only add mut where you really need it.','När ett värde inte kan ändras vet både du och kompilatorn att det förblir samma. Du lägger bara till mut där du verkligen behöver det.')},
 {id:'r2f',t:'code',xp:25,title:L('Laws of the realm','Rikets lagar'),
  body:L('<p>A <code>const</code> is a value that never changes, written in CAPITALS outside main. Constants always need a type, like <code>u32</code> (a whole number that can’t be negative).</p><pre>const MAX_HP: u32 = 100;\n\nfn main() {\n    println!("{}", MAX_HP);\n}</pre>','<p>En <code>const</code> är ett värde som aldrig ändras, skrivet med VERSALER utanför main. Konstanter behöver alltid en typ, som <code>u32</code> (ett heltal som inte kan vara negativt).</p><pre>const MAX_HP: u32 = 100;\n\nfn main() {\n    println!("{}", MAX_HP);\n}</pre>'),
  goal:L('Make a constant MAX_LEVEL = 99 and print: Max level: 99','Skapa en konstant MAX_LEVEL = 99 och skriv: Max level: 99'),hint:L('const MAX_LEVEL: u32 = 99; goes above fn main.','const MAX_LEVEL: u32 = 99; ska stå ovanför fn main.'),
  starter:M(''),sol:'const MAX_LEVEL: u32 = 99;\n\n'+M('println!("Max level: {}", MAX_LEVEL);'),ck:all(eq('Max level: 99'),uses(/const MAX_LEVEL/))},
]},

 {id:'r3a',t:'code',xp:25,title:L('Two kinds of number','Två sorters tal'),

 {id:'r3c',t:'predict',xp:10,title:L('Shape-shifting numbers','Formskiftande tal'),code:M('let a: u8 = 200;\nlet b = a as u16 + 100;\nprintln!("{b}");'),opts:['300','44','A panic','error[E0308]: mismatched types'],a:0,

 {id:'r3d',t:'code',xp:25,title:L('True crab','Äkta krabba'),
